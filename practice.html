<script>
(function () {
  const D = window.CJ_DATA, G = window.CJ_GRAMMAR.GRAMMAR, R = window.CJ_READ.PASSAGES;
  const $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  const N = 8, MAX_ROUND = 3, CIRC = ['', '①', '②', '③'];

  /* ---------- 練習カードの山 = 文の倉庫（カード・文法・よむ・例文）のすべての文 ----------
     答えは「ふつう」。タップすると「ていねい」に切り替わる */
  const B = window.CJ_BANK, POOL = B.items;
  // 型（かた）の文も、練習カードとして使えるようにする（文の倉庫とは別にしておく）
  const PT = window.CJ_PATTERNS;
  const byKey = Object.assign({}, B.byKey);
  const ptBy = {};   // 🔁 型 の 練習 は pattern.html に うつした（v34）

  /* ---------- 日付で決まる乱数（同じ日は同じカード） ---------- */
  function seedRand(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    let a = h >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  }
  function seededShuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }


  /* ---------- ひる／よる の山を作る ----------
     ひる：前に出なかった文 2 枚 ＋ まだ練習していない文（日替わりの順番）
     よる：きょう出なかった文（ひるの まちがい） ＋ 前に出なかった文 ＋ ひるに出ていない新しい文 */
  /* 型 の よる：2つ の 型 × 4枚。まだ言えていない文が多い型を先に。同じ日は同じ型 */
  function buildSlot(date, slot) {
    if (slot === 'pat') return { k: [], r: [], s: null };   // 型 は pattern.html で 練習（結果 だけ ここ に 記録）
    const d = CJ.getData(), prac = d.prac, rnd = seedRand(date + ':' + slot);
    const today = d.daily[date] || {};
    const lunchKeys = new Set(today.lunch ? today.lunch.k : []);
    const order = seededShuffle(POOL, rnd);
    const fresh = order.filter(x => !prac[x.key]);
    const old = order.filter(x => prac[x.key] && prac[x.key].l === 'ok').sort((a, b) => (prac[a.key].d < prac[b.key].d ? -1 : 1));
    const weakToday = order.filter(x => prac[x.key] && prac[x.key].l === 'ng' && prac[x.key].d === date);
    const weakOld = order.filter(x => prac[x.key] && prac[x.key].l === 'ng' && prac[x.key].d !== date);
    let pick = [];
    const add = list => list.forEach(x => { if (pick.length < N && !pick.includes(x)) pick.push(x); });
    if (slot === 'lunch') { add(weakOld.slice(0, 2)); add(fresh); add(old); }
    else { add(weakToday); add(weakOld.slice(0, 3)); add(fresh.filter(x => !lunchKeys.has(x.key))); add(old.filter(x => !lunchKeys.has(x.key))); add(fresh); }
    pick = seededShuffle(pick, rnd);
    return { k: pick.map(x => x.key), r: pick.map(() => 'c'), s: null };
  }
  function getSlot(date, slot) {
    const d = CJ.getData(), cur = d.daily[date] && d.daily[date][slot];
    if (cur && cur.k.every(k => byKey[k])) return cur;
    const v = buildSlot(date, slot);
    CJ.saveDailySlot(date, slot, v);
    return v;
  }

  /* ---------- メニュー（ひる／よる・こんしゅう） ---------- */
  // selDate：えらんだ日（ふだん は きょう）。こんしゅう の 日 を タップ すると、その日 の ひる／よる を あとから やりなおせる
  let selDate = CJ.dateKey();
  function renderMenu() {
    $('menu').style.display = ''; $('drill').style.display = 'none';
    $('introText').textContent = t('pr.intro', { s: CJ.drillSecs() });
    const today = CJ.dateKey(), d = CJ.getData(), day = d.daily[selDate] || {}, past = selDate !== today;
    const sd = new Date(selDate + 'T00:00:00');
    $('dayHead').innerHTML = past ? '<div class="past-head">📅 ' + esc(t('pr.pastDay', { d: (sd.getMonth() + 1) + '/' + sd.getDate() })) + ' <button class="tiny-btn" data-today="1">' + esc(t('pr.backToday')) + '</button></div>' : '';
    const nowSlot = past ? '' : new Date().getHours() < 16 ? 'lunch' : 'night';
    const fm = CJ.focusOf(selDate);
    $('focusBox').innerHTML = CJ.focusChips(selDate) + '<div class="muted" style="font-size:0.78rem;">' + esc(t('focus.note')) + '</div>';
    // ひる：1つ。よる：「よる の カード」 か 「型 の れんしゅう」 を えらぶ（どちらか おわれば よる は できた）
    const lv = day.lunch, ldone = lv && lv.s, nv = day.night, pv = day.pat;
    const ndone = (nv && nv.s) || (pv && pv.s);
    $('slots').innerHTML =
      '<div class="slot' + (ldone ? ' done' : '') + (nowSlot === 'lunch' && !ldone ? ' now' : '') + '">' +
        '<div class="nm">' + esc(t('slot.lunch')) + ' ' + CJ.FOCUS_ICON[fm] + '</div>' +
        '<div class="st">' + esc(ldone ? t('slot.done', { s: lv.s[0], t: lv.s[1] }) : t('focus.desc.' + fm) + ' · ' + t('slot.todo', { n: N })) + '</div>' +
        '<button class="btn' + (ldone ? ' btn-secondary' : '') + '" data-slot="lunch">' + esc(t(ldone ? 'slot.redo' : 'slot.start')) + '</button></div>' +
      '<div class="slot' + (ndone ? ' done' : '') + (nowSlot === 'night' && !ndone ? ' now' : '') + '">' +
        '<div class="nm">' + esc(t('slot.night')) + '</div>' +
        '<div class="st">' + esc(t('slot.nightPick')) + '</div>' +
        '<button class="btn' + (nv && nv.s ? ' btn-secondary' : '') + '" data-slot="night" style="margin-bottom:6px;">' + esc(t('slot.nightCards')) + (nv && nv.s ? ' ✓ ' + nv.s[0] + '/' + nv.s[1] : '') + '</button>' +
        '<button class="btn' + (pv && pv.s ? ' btn-secondary' : '') + '" data-slot="pat">' + esc(t('slot.pat')) + (pv && pv.s ? ' ✓ ' + pv.s[0] + '/' + pv.s[1] : '') + '</button></div>';
    // こんしゅう：7日分の ☀️ / 🌙
    const days = [];
    for (let i = 13; i >= 0; i--) { const x = new Date(); x.setDate(x.getDate() - i); days.push(x); }
    $('week').innerHTML = days.map(x => {
      const k = CJ.dateKey(x), v = d.daily[k] || {};
      const l = v.lunch && v.lunch.s, n = (v.night && v.night.s) || (v.pat && v.pat.s);
      return '<button class="rm-day' + (k === today ? ' today' : '') + (k === selDate ? ' sel' : '') + '" data-day="' + k + '">' + (x.getMonth() + 1) + '/' + x.getDate() +
        '<b>' + (l ? '☀️' : '・') + (n ? '🌙' : '・') + '</b></button>';
    }).join('');
  }

  /* ---------- 声に出すカード ----------
     英語を見る → N 秒以内に日本語で言う → 答えを見る → 言えた／出なかった。2回目以降は出なかった文だけ（最大3回） */
  let st = null;
  // 答えは基本「ふつう」。答えのカードをタップすると「ていねい」（st.pol = true）
  function startDrill(title, keys, regs, slot, date) {
    const seen = new Set();
    const items = keys.map(k => ({ x: byKey[k], reg: 'c' })).filter(o => o.x && !seen.has(o.x.key) && seen.add(o.x.key));
    const dt = date || CJ.dateKey();
    st = { title, slot, date: dt, focus: slot === 'lunch' ? CJ.focusOf(dt) : 'speak', items, round: 1, queue: CJ.shuffle(items), i: 0, res: [], hist: [], phase: 'card', shown: false, pol: false };
    $('menu').style.display = 'none'; $('drill').style.display = '';
    renderDrill(); window.scrollTo({ top: 0 });
  }
  function itemKey(o) { return o.x.key + ':' + o.reg; }
  /* ---------- 型 の 練習：［A］に入る言葉を、選択肢からタップして選ぶ ----------
     英語を見る → 型の［A］に入る言葉を 4つ の中から選ぶ → 文が完成して読み上げ → つぎへ */
  /* 👂 聞く ／ 📖 読む：意味 を 4つ から えらぶ（自動 で ⭕❌）
     聞く：文字 は 出さず 音 だけ（ようちゃん の 声 が あれば それ）。読む：日本語 を 見せて、ローマ字 は 答え の あと */
  function meanOpts(o) {
    if (o.mopts) return o.mopts;
    const en = o.x.en, others = CJ.shuffle(POOL.filter(y => y.en && y.en !== en && y.key !== o.x.key)).slice(0, 3);
    o.mopts = CJ.shuffle([{ en, ok: true }].concat(others.map(y => ({ en: y.en }))));
    return o.mopts;
  }
  function renderUnderstand() {
    const box = $('drill'), o = st.queue[st.i], x = o.x, f = st.pol ? x.p : x.c, opts = meanOpts(o), listen = st.focus === 'listen';
    const picked = st.mpick != null ? opts[st.mpick] : null;
    let h = '<div class="counter"><span class="muted">' + CJ.FOCUS_ICON[st.focus] + ' ' + esc(st.title) + ' · ' + esc(t('pr.round', { r: st.round })) + ' · ' + (st.i + 1) + '/' + st.queue.length + '</span>' +
      '<button class="tiny-btn" data-a="quit">' + esc(t('pr.quit')) + '</button></div>' + (picked ? sceneHtml(x) : '');   // 場面 は 答え の あと（先 に 出すと ヒント に なりすぎる）
    if (listen && !picked) {
      h += '<div class="u-listen"><button class="u-play" data-say="' + esc(f[0]) + '" aria-label="' + esc(t('u.play')) + '">🔊</button>' +
        '<button class="tiny-btn" data-say="' + esc(f[0]) + '" data-slow="1">🐢 ' + esc(t('vc.slow')) + '</button></div>' +
        '<div class="muted" style="text-align:center;">' + esc(t('u.listen')) + '</div>';
    } else {
      // 読む：かな ／ 漢字 ＋ よみ ／ 漢字 だけ の 3段階（答え の あと は よみ つき）
      const lv = ['kana', 'ruby', 'kanji'].includes(CJ.getPrefs().readLevel) ? CJ.getPrefs().readLevel : 'ruby';
      const jaShow = picked ? CJ.ruby(f[2]) : lv === 'kana' ? esc(f[0]) : lv === 'kanji' ? esc(CJ.plain(f[2])) : CJ.ruby(f[2]);
      h += '<div class="seg3 seg3-sm">' + ['kana', 'ruby', 'kanji'].map(v => '<button class="' + (v === lv ? 'active' : '') + '" data-rl="' + v + '"><span>' + esc(t('rl.' + v)) + '</span></button>').join('') + '</div>' +
        '<div class="u-ja ja">' + jaShow + '</div>' +
        (picked ? '<div class="romaji" style="text-align:center;">' + esc(f[1]) + '</div><div style="text-align:center;">' + CJ.sayBtns(f[0]) + '</div>' : '<div class="muted" style="text-align:center;">' + esc(t('u.read')) + '</div>');
    }
    if (!picked) {
      h += '<div class="q-text" style="text-align:center; margin-top:0.6rem;">' + esc(t('u.mean')) + '</div><div class="options">' +
        opts.map((z, k) => '<button class="option-btn" data-mpick="' + k + '">' + esc(z.en) + '</button>').join('') + '</div>';
    } else {
      h += '<div class="feedback ' + (picked.ok ? 'correct' : 'wrong') + '" style="display:block;"><b>' + esc(picked.ok ? t('u.ok') : t('u.ng')) + '</b> ' + esc(x.en) +
        (listen ? '<div class="u-ja ja" style="font-size:1.3rem;">' + CJ.jaHtml(f) + '</div><div class="romaji">' + esc(f[1]) + '</div><div>' + CJ.sayBtns(f[0]) + '</div>' : '') +
        hintHtml(x) + '<button class="btn" data-a="mnext" style="margin-top:0.6rem;">' + esc(t('q.next')) + '</button></div>';
    }
    box.innerHTML = h;
    if (listen && !picked && !st.played) { st.played = true; setTimeout(() => CJ.speak(f[0]), 300); }
  }
  function renderDrill() {
    if (st.phase === 'card' && st.focus && st.focus !== 'speak') { renderUnderstand(); return; }
    const box = $('drill'), secs = CJ.drillSecs();
    if (st.phase !== 'card') return renderRoundEnd();
    const o = st.queue[st.i], x = o.x;
    if (x.only) st.pol = x.only === 'p';   // 片方だけ の文（じこしょうかい は ていねい、など）
    const ans = st.pol ? x.p : x.c, same = x.c[0] === x.p[0];
    box.innerHTML = '<div class="counter"><span class="muted">' + esc(st.title) + ' · ' + esc(t('pr.round', { r: st.round })) + ' · ' + (st.i + 1) + '/' + st.queue.length + '</span>' +
      '<button class="tiny-btn" data-a="quit">' + esc(t('pr.quit')) + '</button></div>' +
      '<div style="text-align:center;"><label class="kj-toggle"><input type="checkbox" data-kanji-toggle' + (CJ.showKanji() ? ' checked' : '') + '> ' + esc(t('rd.kanji')) + '</label></div>' +
      sceneHtml(x) +
      '<div class="dr-en">“' + esc(x.en) + '”</div>' +
      (x.pid && ptBy[x.pid] ? '<div class="pt-hint ja">' + esc(t('pr.patHint')) + ' ' + ptHint(ptBy[x.pid]) + '</div>' : '') +
      '<div class="dr-timer"><div id="tfill"></div></div>' +
      '<p class="muted" style="text-align:center;">' + esc(t(x.only === 'p' ? 'pr.sayPolite' : 'pr.sayCasual')) + '</p>' +
      (st.shown
        ? '<div class="dr-ans"><div class="flip ' + (st.pol ? 'is-p' : 'is-c') + '" data-a="pol" style="border-radius:12px; padding:0.5rem; border:1px solid var(--border);">' +
            '<div class="flip-top" style="justify-content:center; gap:6px;">' + CJ.regTop(x.only, st.pol, same) + '</div>' +
            '<div class="k ja">' + CJ.jaHtml(ans) + '</div><div class="romaji">' + esc(ans[1]) + '</div></div>' +
          (same ? '' : '<div class="muted" style="font-size:0.78rem; margin-top:0.2rem;">' + esc(t('pr.tapPolite')) + '</div>') +
          (x.tag ? '<div style="margin-top:0.3rem;"><span class="gr-tag">🧩 ' + esc(x.tag) + '</span></div>' : '') +
          hintHtml(x) +
          '<div id="drRes">' + voiceResHtml(st.vres) + '</div>' +
          // 答え の あと：🔊 お手本 ／ 🎙️ もう一回 チェック ／ 🔴 録音 ／ 👂 自分の声（入らない とき は 折り返す）
          '<div class="vc-tools">' +
            '<button class="tiny-btn" data-say="' + esc(ans[0]) + '">🔊 ' + esc(t('vc.model')) + '</button>' +
            '<button class="tiny-btn" data-say="' + esc(ans[0]) + '" data-slow="1">🐢 ' + esc(t('vc.slow')) + '</button>' +
            (CJ.recognitionSupported ? '<button class="tiny-btn" data-a="vcheck" id="vcBtn">🎙️ ' + esc(t('vc.again')) + '</button>' : '') +
            (CJ.recSupported ? '<button class="tiny-btn' + (st.recOn ? ' rec-on' : '') + '" data-a="rec">' + (st.recOn ? '⏹ ' + esc(t('vc.stop')) : '🔴 ' + esc(t('vc.rec'))) + '</button>' +
              '<button class="tiny-btn" data-a="mine"' + (st.recUrl ? '' : ' disabled') + '>👂 ' + esc(t('vc.mine')) + '</button>' : '') +
          '</div>' +
          '<div style="text-align:left;">' + B.linksHtml(x, 6) + CJ.extLinks(ans) + '<div style="text-align:right;">' + CJ.askLink(ans[0] + ' (' + x.en + ')') + '</div></div>' +
          '<div class="btn-row"><button class="btn btn-ok" data-a="ok">' + esc(t('pr.ok')) + '</button><button class="btn" data-a="ng" style="background:#be123c;">' + esc(t('pr.ng')) + '</button></div></div>'
        : '<div id="drRes">' + voiceResHtml(st.vres) + '</div>' +
          '<button class="btn" data-a="show" style="margin-top:0.6rem;">' + esc(t('pr.show')) + '</button>' +
          // 答える 前：声 で 答える（タイマー を 止めて 聞き取る → 自動 で 答え を 出す）
          (CJ.recognitionSupported
            ? '<button class="btn btn-secondary" data-a="vanswer" id="vaBtn" style="margin-top:0.5rem;">🎙️ ' + esc(t('vc.answer')) + '</button>'
            : '<button class="btn btn-secondary" disabled style="margin-top:0.5rem;">🎙️ ' + esc(t('vc.answer')) + '</button><div class="muted" style="font-size:0.78rem; text-align:center;">' + esc(t('vc.noSupport')) + '</div>'));
    const f = $('tfill');
    if (st.frozen != null && !st.shown) { f.style.transition = 'none'; f.style.width = st.frozen + 'px'; }
    else if (!st.shown) { f.style.transition = 'none'; f.style.width = '100%'; void f.offsetWidth; f.style.transition = 'width ' + secs + 's linear'; f.style.width = '0%'; }
    else f.style.width = '0%';
  }
  // 場面（問題 の 上）と 言いかえ ヒント（答え の 下）
  const HN = window.CJ_HINTS;
  const sceneHtml = x => { const h = HN && HN.get(x.key, x.pid); return h ? '<div class="dr-scene">📍 ' + esc(h[0]) + '</div>' : ''; };
  const hintHtml = x => { const h = HN && HN.get(x.key, x.pid); return h ? '<div class="dr-hint">💡 ' + esc(h[1]) + '</div>' : ''; };
  // 声 の 採点 結果：点数・聞き取った 文・文字ごと の 〇×
  function voiceResHtml(v) {
    if (!v) return '';
    if (v.err) return '<div class="rd-result show">' + esc(v.err) + '</div>';
    const ok = v.score >= CJ.PASS_SCORE;
    return '<div class="rd-result show"><span class="sc ' + (ok ? 'ok' : 'ng') + '">' + esc(t(ok ? 'rd.pass' : 'rd.retry', { s: v.score })) + '</span>' +
      '<div class="muted">' + esc(t('rd.heard', { t: v.heard })) + '</div>' +
      (v.marks ? '<div class="vc-marks ja">' + v.marks.map(m => '<span class="' + (m.ok ? 'o' : 'x') + '">' + esc(m.ch) + '<i>' + (m.ok ? '〇' : '×') + '</i></span>').join('') + '</div>' : '') +
      '<div class="muted" style="font-size:0.75rem;">' + esc(t('vc.guide')) + '</div></div>';
  }
  // 型のヒント：「［ A ］ が たべたい な」
  function ptHint(p) {
    const f = CJ.showKanji() ? CJ.ruby(p.c[2]) : esc(p.c[0]);
    return f.split('{X}').join('<span class="pt-slot">［ A ］</span>').split('{Y}').join('<span class="pt-slot">［ B ］</span>');
  }
  function reveal() {
    CJ.abortListen();
    st.shown = true; st.pol = false; renderDrill();
    const o = st.queue[st.i];
    CJ.autoSpeak(o.x.c[0]);
  }
  // 声 で 聞き取って 採点（答え の「表記」と「ひらがな」の 両方 と くらべる）
  function voiceListen(btn, done) {
    const o = st.queue[st.i], ans = st.pol ? o.x.p : o.x.c, res = $('drRes');
    if (st.recOn) CJ.stopRec();
    res.innerHTML = '<div class="rd-result show">' + esc(t('rd.listening')) + '</div>';
    if (btn) btn.classList.add('on');
    const rec = CJ.listen({
      onInterim: s => { res.innerHTML = '<div class="rd-result show">' + esc(t('rd.listening') + ' ' + s) + '</div>'; },
      onFinal: alts => { st.vres = CJ.scoreJa([ans[0], CJ.plain(ans[2])], alts); done(true); },
      onError: m => { st.vres = { err: m }; done(false); },
      onState: on => { if (!on && btn) btn.classList.remove('on'); }
    });
    if (!rec) { st.vres = { err: t('err.recog') }; done(false); }
  }
  // 答える 前 の 🎙️：タイマー を 止めて 聞く → 聞き取れたら 答え を 出す
  function voiceAnswer() {
    const f = $('tfill'); if (f) st.frozen = f.getBoundingClientRect().width;
    if (f) { f.style.transition = 'none'; f.style.width = st.frozen + 'px'; }
    voiceListen($('vaBtn'), ok => {
      if (ok) { st.shown = true; renderDrill(); }
      else renderDrill();
    });
  }
  // 録音 を 止めて、メモリ の 録音 も すてる（次 の カード・やめる とき）
  function resetVoice() {
    if (CJ.isRecording()) { st && (st.dropRec = true); CJ.stopRec(); }
    CJ.abortListen();
    if (st) { if (st.recUrl) URL.revokeObjectURL(st.recUrl); st.recUrl = null; st.recOn = false; st.vres = null; st.frozen = null; }
  }
  function answer(ok) {
    resetVoice();
    const o = st.queue[st.i];
    st.res.push({ o, ok });
    if (st.round === 1) CJ.recordPrac(o.x.key, ok);
    st.i++; st.shown = false; st.pol = false; st.pick = null; st.mpick = null; st.played = false;
    if (st.i < st.queue.length) { renderDrill(); return; }
    const okSet = st.res.filter(r => r.ok).map(r => itemKey(r.o));
    st.hist.push({ round: st.round, said: okSet.length, total: st.res.length, okSet });
    // ひる／よる は1回目の結果を きょう の記録として残す
    if (st.round === 1 && st.slot) {
      const v = getSlot(st.date, st.slot);
      CJ.saveDailySlot(st.date, st.slot, { k: v.k, r: v.r, s: [okSet.length, st.res.length] });
    }
    const miss = st.res.length - okSet.length;
    st.phase = miss === 0 || st.round >= MAX_ROUND ? 'review' : 'roundEnd';
    renderDrill();
  }
  function renderRoundEnd() {
    const box = $('drill'), h = st.hist[st.hist.length - 1];
    const missItems = st.phase === 'review' ? st.items.filter(o => !st.hist.some(x => x.okSet.includes(itemKey(o)))) : st.res.filter(r => !r.ok).map(r => r.o);
    let html = '<h2>' + (st.phase === 'review' ? esc(t('pr.review')) + '：' + esc(st.title) : CIRC[h.round] + ' ' + esc(t('pr.roundEnd', { r: h.round }))) + '</h2>';
    if (st.phase === 'review') {
      html += '<p class="muted">' + st.hist.map(x => CIRC[x.round] + ' ' + x.said + '/' + x.total).join(' → ') + '　' + esc(t('pr.first', { s: st.hist[0].said, t: st.hist[0].total })) + '</p>';
      if (st.slot) html += '<p class="muted" style="margin-bottom:0.6rem;">' + esc(t('pr.saved')) + '</p>';
    } else {
      html += '<div class="stats-grid two" style="margin-bottom:0.8rem;"><div><div class="stat-number">' + h.said + '/' + h.total + '</div><div class="stat-label">' + esc(t('pr.said')) + '</div></div>' +
        '<div><div class="stat-number" style="color:var(--bad);">' + (h.total - h.said) + '</div><div class="stat-label">' + esc(t('pr.missed')) + '</div></div></div>';
    }
    if (missItems.length) {
      if (st.phase === 'review') html += '<div class="muted" style="margin-bottom:0.3rem;">' + esc(t('pr.still')) + '</div>';
      html += missItems.map(o => { const a = o.x.c; return '<div class="miss-row"><div style="display:flex; justify-content:space-between; align-items:center;"><div><div class="k ja">' + CJ.jaHtml(a) + '</div><div class="romaji">' + esc(a[1]) + '</div></div>' + CJ.sayBtns(a[0]) + '</div><div class="muted">' + esc(o.x.en) + '</div></div>'; }).join('');
    } else if (st.phase === 'review') html += '<p style="color:var(--ok); font-weight:800;">' + esc(t('pr.allGood')) + '</p>';
    if (st.phase === 'roundEnd') {
      html += '<button class="btn" data-a="next" style="margin-top:0.6rem;">' + esc(t('pr.nextRound', { r: st.round + 1, n: missItems.length })) + '</button>' +
        '<button class="btn btn-secondary" data-a="end" style="margin-top:0.5rem;">' + esc(t('pr.end')) + '</button>';
    } else {
      html += '<button class="btn" data-a="again" style="margin-top:0.6rem;">' + esc(t('pr.again')) + '</button>' +
        '<button class="btn btn-secondary" data-a="back" style="margin-top:0.5rem;">' + esc(t('pr.back')) + '</button>';
    }
    box.innerHTML = html;
  }

  $('drill').addEventListener('click', e => {
    const rl = e.target.closest('[data-rl]');
    if (rl && st) { CJ.setPref('readLevel', rl.dataset.rl); renderDrill(); return; }
    const mp = e.target.closest('[data-mpick]');
    if (mp && st && st.mpick == null) { st.mpick = Number(mp.dataset.mpick); renderDrill(); return; }
    if (e.target.closest('[data-say], a, label')) return;
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'pol') { const x = st.queue[st.i].x; if (x.c[0] !== x.p[0]) { st.pol = !st.pol; renderDrill(); CJ.autoSpeak((st.pol ? x.p : x.c)[0]); } }
    else if (a === 'show') reveal();
    else if (a === 'mnext') { const o = st.queue[st.i]; answer(!!(o.mopts[st.mpick] || {}).ok); }
    else if (a === 'vanswer') voiceAnswer();
    else if (a === 'vcheck') voiceListen($('vcBtn'), () => renderDrill());
    else if (a === 'rec') {
      // 🔴 で 開始 ／ ⏹ で 停止。止めたら 自分の声 を 1回 自動 で 再生
      if (st.recOn) { CJ.stopRec(); return; }
      const me = st;
      CJ.startRec({
        maxSec: 15,
        onStart: () => { me.recOn = true; if (st === me) renderDrill(); },
        onStop: url => {
          me.recOn = false;
          if (me.dropRec || st !== me) { me.dropRec = false; if (url) URL.revokeObjectURL(url); return; }
          if (me.recUrl) URL.revokeObjectURL(me.recUrl);
          me.recUrl = url; renderDrill(); if (url) CJ.playUrl(url);
        },
        onError: m => { st.vres = { err: m }; renderDrill(); }
      });
    }
    else if (a === 'mine') { if (st.recUrl) CJ.playUrl(st.recUrl); }
    else if (a === 'ok') answer(true);
    else if (a === 'ng') answer(false);
    else if (a === 'next') { const miss = st.res.filter(r => !r.ok).map(r => { delete r.o.opts; return r.o; }); st.round++; st.queue = CJ.shuffle(miss); st.i = 0; st.res = []; st.phase = 'card'; renderDrill(); window.scrollTo({ top: 0 }); }
    else if (a === 'end') { st.phase = 'review'; renderDrill(); }
    else if (a === 'again') { st.round = 1; st.queue = CJ.shuffle(st.items); st.i = 0; st.res = []; st.hist = []; st.phase = 'card'; st.slot = null; renderDrill(); window.scrollTo({ top: 0 }); }
    else if (a === 'quit' || a === 'back') { resetVoice(); st = null; history.replaceState(null, '', 'practice.html'); renderMenu(); }
  });
  $('slots').addEventListener('click', e => {
    const b = e.target.closest('[data-slot]'); if (!b) return;
    const sl = b.dataset.slot;
    if (sl === 'pat') { location.href = 'pattern.html?daily=' + selDate; return; }   // 🔁 型 は 型 の ページ で（終わったら その日 の よる に 記録）
    const v = getSlot(selDate, sl);
    startDrill(sl === 'pat' ? t('slot.pat') : t('slot.' + sl), v.k, v.r, sl, selDate);
  });
  // こんしゅう の 日 を タップ → その日 を えらぶ（上 の ひる／よる が その日 の セット に なる）
  $('week').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (!b) return; selDate = b.dataset.day; renderMenu(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('menu').addEventListener('click', e => {
    if (e.target.closest('[data-today]')) { selDate = CJ.dateKey(); renderMenu(); return; }
    const fb = e.target.closest('[data-focus]'); if (fb) { CJ.setFocus(selDate, fb.dataset.focus); renderMenu(); }
  });
  document.addEventListener('cj:lang', () => { if (st) renderDrill(); else renderMenu(); });
  document.addEventListener('cj:kanji', () => { if (st) renderDrill(); });

  // ?g=文法ID：その文法の例文を ふつう と ていねい の両方で練習（日替わりの記録には入れない）
  const qs = new URLSearchParams(location.search);
  const gid = qs.get('g'), gr = G.find(g => g.id === gid);
  // ?pt=型ID：その型の文を ぜんぶ 練習（日替わりの記録には入れない）
  if (qs.get('pt')) { location.replace('pattern.html?p=' + encodeURIComponent(qs.get('pt'))); return; }
  if (gr) {
    const keys = [], regs = [];
    gr.ex.forEach((e, i) => { keys.push('gr:' + gr.id + ':' + i); regs.push('c'); });
    startDrill('🧩 ' + gr.tag, keys, regs, null);
  } else renderMenu();
})();
</script>
