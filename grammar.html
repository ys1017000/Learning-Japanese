<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grammar – マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="card">
    <h2 data-i18n="gr.title"></h2>
    <p data-i18n="gr.intro"></p>
    <div style="margin-top:0.6rem;"><label class="kj-toggle"><input type="checkbox" data-kanji-toggle> <span data-i18n="rd.kanji"></span></label></div>
  </div>
  <div id="list"></div>
</main>


<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="grammar-data.js"></script>
<script src="read-data.js"></script>
<script src="examples-data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script src="bank.js"></script>
<script>
(function () {
  const G = window.CJ_GRAMMAR.GRAMMAR, B = window.CJ_BANK, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  const flipped = {};   // 'gid:i' → true ならていねいを表示（最初は ふつう）
  const startG = new URLSearchParams(location.search).get('g');
  let openIds = new Set([startG || G[0].id]);

  // タップで ふつう ⇔ ていねい が切り替わるカード（共通の形）。下に、この文の漢字・単語へのリンク
  function flipCard(id) {
    const it = B.byKey['gr:' + id];
    return CJ.flipHtml(id, it, !!flipped[id], B.linksHtml(it, 5));
  }

  function render() {
    $('list').innerHTML = G.map((g, n) =>
      '<details class="gr" data-g="' + g.id + '"' + (openIds.has(g.id) ? ' open' : '') + '><summary><span class="gr-num">' + (n + 1) + '</span>' +
        '<span style="flex:1;"><b>' + esc(CJ.tx(g, 'title')) + '</b><br><span class="gr-tag ja">' + esc(g.tag) + '</span></span></summary>' +
      '<div class="gr-body">' +
        '<div class="gr-form ja">' + esc(g.form) + '</div>' +
        '<p>' + esc(CJ.tx(g, 'how')) + '</p>' +
        (g.table ? '<div style="font-weight:700; margin-top:0.7rem; font-size:0.85rem;">' + esc(t('gr.table')) + '</div><table class="gr-table ja"><tr><th>' + esc(t('gr.col.d')) + '</th><th>' + esc(t('gr.col.c')) + '</th><th>' + esc(t('gr.col.p')) + '</th></tr>' +
          g.table.map(r => '<tr><td>' + esc(r[0]) + '</td><td class="c">' + esc(r[1]) + '</td><td class="p">' + esc(r[2]) + '</td></tr>').join('') + '</table>' : '') +
        '<div style="font-weight:700; margin:0.8rem 0 0.2rem; font-size:0.85rem;">' + esc(t('gr.examples')) + '</div>' +
        '<div class="tap-hint">' + esc(t('tap.hint')) + '</div>' +
        g.ex.map((e, i) => flipCard(g.id + ':' + i)).join('') +
        // 練習 の やり方 を えらぶ（話す・聞く・読む）。やめたら この 文法 に もどる
        '<div style="font-weight:700; margin:0.8rem 0 0.3rem; font-size:0.85rem;">' + esc(t('gr.practice')) + '</div>' +
        '<div class="seg3">' + ['speak', 'listen', 'read'].map(m => '<a href="practice.html?g=' + g.id + '&f=' + m + '&back=' + encodeURIComponent('grammar.html?g=' + g.id) + '" class="seg3-a">' + CJ.FOCUS_ICON[m] + '<span>' + esc(t('focus.' + m)) + '</span></a>').join('') + '</div>' +
      '</div></details>').join('');
  }

  $('list').addEventListener('click', e => {
    if (e.target.closest('[data-say], a')) return;   // 🔊 やリンクを押したときは切り替えない
    const c = e.target.closest('[data-flip]'); if (!c) return;
    flipped[c.dataset.flip] = !flipped[c.dataset.flip];
    render();
  });
  $('list').addEventListener('toggle', e => {
    const d = e.target.closest('details'); if (!d) return;
    if (d.open) { openIds.add(d.dataset.g); CJ.markStudied(); } else openIds.delete(d.dataset.g);
  }, true);
  document.addEventListener('cj:lang', render);
  document.addEventListener('cj:kanji', render);
  render();
  if (startG) { const el = document.querySelector('[data-g="' + startG + '"]'); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); }   // 練習 から もどった とき
})();
</script>
</body>
</html>
