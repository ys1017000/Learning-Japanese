<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sentence endings – マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="subnav">
    <a href="cards.html" data-i18n="sub.cards">Polite ⇔ Casual</a>
    <a href="endings.html" class="active" data-i18n="sub.endings">Endings</a>
    <a href="grammar.html" data-i18n="sub.grammar">Grammar</a>
    <a href="guide.html" data-i18n="sub.guide">Tips</a>
  </div>
  <div class="card">
    <h2 data-i18n="end.title"></h2>
    <p data-i18n="end.intro"></p>
    <div class="jump-row" id="jumpRow" style="margin-top:0.7rem;"></div>
    <div style="margin-top:0.7rem;"><label class="kj-toggle"><input type="checkbox" data-kanji-toggle> <span data-i18n="rd.kanji"></span></label></div>
  </div>

  <div id="endList"></div>

  <div class="card" id="compare">
    <h2 data-i18n="end.compare"></h2>
    <div id="cmpBox"></div>
  </div>

  <a class="btn" href="quiz.html?mode=endings" data-i18n="end.toQuiz"></a>
</main>

<nav>
  <a href="index.html"><span class="ni">🏠</span><span data-i18n="nav.home">Home</span></a>
  <a href="practice.html"><span class="ni">🔥</span><span data-i18n="nav.today">Today</span></a>
  <a href="cards.html" class="active"><span class="ni">📚</span><span data-i18n="nav.learn">Learn</span></a>
  <a href="kanji.html"><span class="ni">✍️</span><span data-i18n="nav.kanji">Kanji</span></a>
  <a href="read.html"><span class="ni">🗣️</span><span data-i18n="nav.read">Read</span></a>
  <a href="quiz.html"><span class="ni">❓</span><span data-i18n="nav.quiz">Quiz</span></a>
</nav>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const D = window.CJ_DATA, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t, ja = () => CJ.lang() === 'ja';

  function render() {
    $('jumpRow').innerHTML = D.ENDINGS.map(e => '<a class="chip ja" href="#end-' + e.id + '" style="text-decoration:none;">' + esc(e.mark) + '</a>').join('') +
      '<a class="chip" href="#compare" style="text-decoration:none;">' + esc(t('end.cmpChip')) + '</a>';

    $('endList').innerHTML = D.ENDINGS.map(e =>
      '<div class="card" id="end-' + e.id + '">' +
        '<div class="end-head"><span class="end-mark ja">' + esc(e.mark) + '</span><span class="romaji">' + esc(e.romaji) + '</span><span class="end-title">' + esc(CJ.tx(e, 'title')) + '</span></div>' +
        '<p class="end-meaning">' + esc(CJ.tx(e, 'meaning')) + '</p>' +
        e.ex.map(x => '<div class="ex-row"><div><div class="k ja">' + CJ.jaHtml([x[0], x[1], x[5]]) + '</div><div class="romaji">' + esc(x[1]) + '</div>' +
          '<div class="e">' + esc(x[2]) + '</div><div class="n">' + esc(ja() && x[4] ? x[4] : x[3]) + '</div></div>' + CJ.sayBtns(x[0]) + '</div>').join('') +
        (e.tip ? '<div class="tip">💡 ' + esc(CJ.tx(e, 'tip')) + '</div>' : '') +
      '</div>').join('');

    $('cmpBox').innerHTML = D.COMPARE.map(c =>
      '<p style="font-weight:700; margin:0.6rem 0 0.2rem;" class="ja">' + esc(c.base) + '</p><table class="cmp-table">' +
      c.rows.map(r => '<tr><td class="k ja">' + CJ.jaHtml([r[0], r[1], r[4]]) + '<div class="romaji" style="font-weight:normal; font-size:0.8rem;">' + esc(r[1]) + '</div></td><td class="muted">' + esc(ja() && r[3] ? r[3] : r[2]) + '</td><td style="text-align:right;">' + CJ.sayBtns(r[0]) + '</td></tr>').join('') +
      '</table>').join('');
  }
  document.addEventListener('cj:lang', render);
  document.addEventListener('cj:kanji', render);
  render();
  // ページを開いたら学習した日として記録
  CJ.markStudied();
})();
</script>
</body>
</html>
