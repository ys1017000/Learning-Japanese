<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マルちゃんのペース">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="card">
    <div class="hello" data-i18n="home.hello">Heyy マルちゃん！ 👋</div>
    <p class="muted" id="introText"></p>
    <a class="tiny-btn" href="help.html" id="helpLink" style="display:inline-block; margin-top:0.6rem; text-decoration:none;">📘 <span data-i18n="home.help"></span><span id="helpNew" style="display:none; margin-left:6px; background:var(--primary); color:#fff; border-radius:999px; padding:0 7px; font-size:0.7rem;">NEW</span></a>
  </div>

  <div class="card">
    <h2 data-i18n="home.today"></h2>
    <p class="muted" style="margin-bottom:0.7rem;" data-i18n="home.todayDesc"></p>
    <div class="slot-row" id="homeSlots"></div>
  </div>

  <h3 class="menu-sec" data-i18n="home.secLearn"></h3>
  <div class="menu-grid">
    <a class="menu-btn" href="guide.html"><span class="icon">💡</span><span data-i18n="home.m.guide"></span></a>
    <a class="menu-btn" href="basics.html"><span class="icon">🧱</span><span data-i18n="home.m.basics"></span></a>
    <a class="menu-btn" href="grammar.html"><span class="icon">🧩</span><span data-i18n="home.m.grammar"></span></a>
    <a class="menu-btn" href="endings.html"><span class="icon">💬</span><span data-i18n="home.m.endings"></span></a>
    <a class="menu-btn" href="map.html"><span class="icon">🗾</span><span data-i18n="home.m.map"></span></a>
  </div>
  <h3 class="menu-sec" data-i18n="home.secPractice"></h3>
  <div class="menu-grid">
    <a class="menu-btn" href="cards.html"><span class="icon">🃏</span><span data-i18n="home.m.cards"></span></a>
    <a class="menu-btn" href="switch.html"><span class="icon">🔄</span><span data-i18n="home.m.switch"></span></a>
    <a class="menu-btn" href="pattern.html"><span class="icon">🔁</span><span data-i18n="home.m.patterns"></span></a>
    <a class="menu-btn" href="read.html"><span class="icon">📜</span><span data-i18n="home.m.read"></span></a>
    <a class="menu-btn" href="kanji.html"><span class="icon">✍️</span><span data-i18n="home.m.kanji"></span></a>
    <a class="menu-btn" href="words.html"><span class="icon">📝</span><span data-i18n="home.m.words"></span></a>
    <a class="menu-btn" href="quiz.html"><span class="icon">❓</span><span data-i18n="home.m.quiz"></span></a>
  </div>
  <a class="btn btn-insta" href="ask.html" style="margin-bottom:0.5rem;">💌 <span data-i18n="home.m.ask"></span></a>
  <a class="btn btn-secondary" href="record.html" style="margin-bottom:1rem; display:none;" data-dev data-i18n="rec.link"></a>

  <div class="card">
    <h2 data-i18n="home.progress"></h2>
    <div class="stats-grid two">
      <div><div class="stat-number" id="stLearned">0</div><div class="stat-label" data-i18n="st.cards"></div></div>
      <div><div class="stat-number" id="stKanji">0</div><div class="stat-label" data-i18n="st.kanji"></div></div>
      <div><div class="stat-number" id="stWords">0</div><div class="stat-label" data-i18n="st.words"></div></div>
      <div><div class="stat-number" id="stPref">0</div><div class="stat-label">🗾 / 47</div></div>
      <div><div class="stat-number" id="stAcc">–</div><div class="stat-label" data-i18n="st.acc"></div></div>
      <div><div class="stat-number" id="stStreak">0</div><div class="stat-label" data-i18n="st.streak"></div></div>
    </div>
    <a class="btn" id="mistakeBtn" href="quiz.html?mode=mistakes" style="display:none; margin-top:1rem; background:#be123c;"></a>
  </div>

  <div class="card tip-card">
    <h2 data-i18n="home.tip"></h2>
    <div id="tipBox"></div>
  </div>

</main>


<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const D = window.CJ_DATA, K = window.CJ_KANJI, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;

  function renderIntro() {
    $('introText').innerHTML = t('home.intro');
    try { $('helpNew').style.display = localStorage.getItem('cj_helpSeen') ? 'none' : ''; } catch (e) {}
  }
  function renderStats() {
    const d = CJ.getData();
    const ids = new Set(D.CARDS.map(c => c.id)), ks = new Set(K.KANJI.map(k => k.k));
    $('stLearned').textContent = d.learned.filter(x => ids.has(x)).length + '/' + D.CARDS.length;
    $('stKanji').textContent = d.kanji.filter(x => ks.has(x)).length + '/' + K.KANJI.length;
    const ws = new Set(window.CJ_WORDS.WORDS.map(w => w.id));
    $('stWords').textContent = d.words.filter(x => ws.has(x)).length + '/' + ws.size;
    $('stPref').textContent = d.pref.length;
    $('stAcc').textContent = d.quiz.total ? Math.round(d.quiz.correct / d.quiz.total * 100) + '%' : '–';
    $('stStreak').textContent = CJ.calcStreak(d.history);
    const nWrong = Object.keys(d.wrong).length;
    $('mistakeBtn').style.display = nWrong ? '' : 'none';
    $('mistakeBtn').textContent = t('home.mistakes', { n: nWrong });
  }

  // 今日のヒント：日付で決まるカードを1枚
  function renderTip() {
    const withNote = D.CARDS.filter(c => c.note);
    const n = Math.floor(new Date(CJ.dateKey() + 'T00:00:00').getTime() / 86400000);
    const c = withNote[n % withNote.length];
    $('tipBox').innerHTML =
      (c.only !== 'c' ? '<div><span class="reg polite">' + t('reg.polite') + '</span> <b class="ja">' + esc(c.p[0]) + '</b> ' + CJ.sayBtns(c.p[0]) + '</div>' : '') +
      (c.only !== 'p' ? '<div><span class="reg casual">' + t('reg.casual') + '</span> <b class="ja">' + esc(c.c[0]) + '</b> ' + CJ.sayBtns(c.c[0]) + '</div>' : '') +
      '<div class="romaji">' + esc(c.c[1]) + '</div>' +
      '<div class="muted" style="margin-top:0.3rem;">“' + esc(c.en) + '” — ' + esc(CJ.tx(c, 'note')) + '</div>';
  }

  // きょう の れんしゅう（ひる／よる）の状況
  function renderToday() {
    const v = CJ.getData().daily[CJ.dateKey()] || {}, nowSlot = new Date().getHours() < 16 ? 'lunch' : 'night';
    $('homeSlots').innerHTML = ['lunch', 'night'].map(sl => {
      // よる は「カード」か「型」のどちらか おわれば できた
      const x = sl === 'night' ? ((v.night && v.night.s) ? v.night : v.pat) : v[sl], done = x && x.s;
      return '<a class="slot' + (done ? ' done' : '') + (sl === nowSlot && !done ? ' now' : '') + '" href="practice.html" style="text-decoration:none; color:inherit;">' +
        '<div class="nm">' + esc(t('slot.' + sl)) + (sl === 'lunch' ? ' ' + CJ.FOCUS_ICON[CJ.focusOf(CJ.dateKey())] : '') + '</div><div class="st" style="margin-bottom:0;">' + esc(done ? t('slot.done', { s: x.s[0], t: x.s[1] }) : t('slot.start')) + '</div></a>';
    }).join('');
  }
  function renderAll() { renderToday(); renderIntro(); renderStats(); renderTip(); }
  document.addEventListener('cj:lang', renderAll);
  renderAll();
})();
</script>
</body>
</html>
