<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マルちゃんのペース">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="card">
    <div class="hello" data-i18n="home.hello">Heyy マルちゃん！ 👋</div>
    <p class="muted" id="introText"></p>
    <a class="tiny-btn" href="help.html" id="helpLink" style="display:inline-block; margin-top:0.6rem; text-decoration:none;">📘 <span data-i18n="home.help"></span><span id="helpNew" style="display:none; margin-left:6px; background:var(--primary); color:#fff; border-radius:999px; padding:0 7px; font-size:0.7rem;">NEW</span></a>
  </div>

  <div class="card">
    <h2 data-i18n="home.today"></h2>
    <p class="muted" style="margin-bottom:0.7rem;" data-i18n="home.todayDesc"></p>
    <div class="slot-row" id="homeSlots"></div>
  </div>

  <h3 class="menu-sec" data-i18n="home.secLearn"></h3>
  <div class="menu-grid">
    <a class="menu-btn" href="guide.html"><span class="icon">💡</span><span data-i18n="home.m.guide"></span></a>
    <a class="menu-btn" href="basics.html"><span class="icon">🧱</span><span data-i18n="home.m.basics"></span></a>
    <a class="menu-btn" href="grammar.html"><span class="icon">🧩</span><span data-i18n="home.m.grammar"></span></a>
    <a class="menu-btn" href="endings.html"><span class="icon">💬</span><span data-i18n="home.m.endings"></span></a>
    <a class="menu-btn" href="map.html"><span class="icon">🗾</span><span data-i18n="home.m.map"></span></a>
  </div>
  <h3 class="menu-sec" data-i18n="home.secPractice"></h3>
  <div class="menu-grid">
    <a class="menu-btn" href="cards.html"><span class="icon">🃏</span><span data-i18n="home.m.cards"></span></a>
    <a class="menu-btn" href="switch.html"><span class="icon">🔄</span><span data-i18n="home.m.switch"></span></a>
    <a class="menu-btn" href="pattern.html"><span class="icon">🔁</span><span data-i18n="home.m.patterns"></span></a>
    <a class="menu-btn" href="read.html"><span class="icon">📜</span><span data-i18n="home.m.read"></span></a>
    <a class="menu-btn" href="kanji.html"><span class="icon">✍️</span><span data-i18n="home.m.kanji"></span></a>
    <a class="menu-btn" href="words.html"><span class="icon">📝</span><span data-i18n="home.m.words"></span></a>
    <a class="menu-btn" href="quiz.html"><span class="icon">❓</span><span data-i18n="home.m.quiz"></span></a>
  </div>
  <a class="btn btn-insta" href="ask.html" style="margin-bottom:0.5rem;">💌 <span data-i18n="home.m.ask"></span></a>
  <a class="btn btn-secondary" href="record.html" style="margin-bottom:1rem; display:none;" data-dev data-i18n="rec.link"></a>

  <div class="card">
    <h2 data-i18n="home.progress"></h2>
    <div class="stats-grid two">
      <div><div class="stat-number" id="stLearned">0</div><div class="stat-label" data-i18n="st.cards"></div></div>
      <div><div class="stat-number" id="stKanji">0</div><div class="stat-label" data-i18n="st.kanji"></div></div>
      <div><div class="stat-number" id="stWords">0</div><div class="stat-label" data-i18n="st.words"></div></div>
      <div><div class="stat-number" id="stPref">0</div><div class="stat-label">🗾 / 47</div></div>
      <div><div class="stat-number" id="stAcc">–</div><div class="stat-label" data-i18n="st.acc"></div></div>
      <div><div class="stat-number" id="stStreak">0</div><div class="stat-label" data-i18n="st.streak"></div></div>
    </div>
    <a class="btn" id="mistakeBtn" href="quiz.html?mode=mistakes" style="display:none; margin-top:1rem; background:#be123c;"></a>
  </div>

  <div class="card tip-card">
    <h2 data-i18n="home.tip"></h2>
    <div id="tipBox"></div>
  </div>

  <div class="card">
    <h2 data-i18n="set.title"></h2>
    <div class="setting-row"><span data-i18n="set.lang"></span><span class="seg" id="langSeg"><button data-lang="en">English</button><button data-lang="ja">ひらがな</button><button data-lang="jk">漢字(かんじ)</button></span></div>
    <div class="setting-row"><span data-i18n="set.theme"></span><span class="seg" id="themeSeg"><button data-theme="pink" data-i18n="theme.pink"></button><button data-theme="matcha" data-i18n="theme.matcha"></button><button data-theme="sky" data-i18n="theme.sky"></button></span></div>
    <div class="setting-row"><span data-i18n="set.secs"></span><span class="seg" id="secsSeg"><button data-secs="3"></button><button data-secs="5"></button><button data-secs="8"></button></span></div>
    <div class="setting-row"><label for="optRomaji" data-i18n="set.romaji"></label><input type="checkbox" id="optRomaji"></div>
    <div class="setting-row"><label for="optAuto" data-i18n="set.auto"></label><input type="checkbox" id="optAuto"></div>
    <div class="setting-row"><span data-i18n="set.rate"></span><span class="seg" id="rateSeg"><button data-rate="0.75" data-i18n="rate.slow"></button><button data-rate="0.9" data-i18n="rate.normal"></button><button data-rate="1.05" data-i18n="rate.fast"></button></span></div>
    <div class="setting-row"><span data-i18n="set.voice"></span><select id="voiceSel" style="max-width:60%; font-size:16px; padding:4px; border:1px solid var(--border); border-radius:8px;"></select></div>
    <div class="setting-row"><span data-i18n="set.vmode"></span><span class="seg" id="vmodeSeg"><button data-vm="natural" data-i18n="vmode.natural"></button><button data-vm="kana" data-i18n="vmode.kana"></button></span></div>
    <p class="muted" style="font-size:0.78rem;" data-i18n="set.vmodeHelp"></p>
    <div class="setting-row"><span data-i18n="set.vsrc"></span><span class="seg" id="vsrcSeg"><button data-vs="yoh" data-i18n="vsrc.yoh"></button><button data-vs="tts" data-i18n="vsrc.tts"></button></span></div>
    <p class="muted" style="font-size:0.78rem;" data-i18n="set.vsrcHelp"></p>
    <div class="setting-row"><span data-i18n="set.test"></span><span><button class="tiny-btn" id="testYoh">🔊 <span data-i18n="vsrc.yohShort"></span></button> <button class="tiny-btn" id="testVoice">🔊 <span data-i18n="vsrc.ttsShort"></span></button></span></div>
    <div class="notice" style="font-size:0.8rem;" data-i18n="set.voiceHelp"></div>
    <div data-dev style="display:none;"><a class="btn btn-secondary" href="record.html" style="margin-top:0.6rem;" data-i18n="rec.link"></a>
    <p class="muted" style="font-size:0.78rem; margin-top:0.3rem;" data-i18n="rec.linkDesc"></p></div>
    <div class="notice" id="voiceNotice" style="display:none;"></div>
    <p class="muted" style="margin-top:0.6rem;" data-i18n="set.spaces"></p>
    <p class="muted" id="verText" style="margin-top:0.4rem; font-size:0.75rem; text-align:right;"></p>
  </div>

  <div class="card" data-dev style="display:none;">
    <h2 data-i18n="bk.title"></h2>
    <p class="muted" data-i18n="bk.desc"></p>
    <div class="btn-row">
      <button class="btn" id="exportBtn" data-i18n="bk.down"></button>
      <button class="btn btn-secondary" id="importBtn" data-i18n="bk.load"></button>
    </div>
    <div class="radio-row">
      <label><input type="radio" name="importMode" value="merge" checked> <span data-i18n="bk.merge"></span></label>
      <label><input type="radio" name="importMode" value="replace"> <span data-i18n="bk.replace"></span></label>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
    <div class="status-msg" id="importStatus"></div>
  </div>
</main>

<nav>
  <a href="index.html" class="active"><span class="ni">🏠</span><span data-i18n="nav.home">Home</span></a>
  <a href="practice.html"><span class="ni">🔥</span><span data-i18n="nav.today">Today</span></a>
  <a href="cards.html"><span class="ni">📚</span><span data-i18n="nav.learn">Learn</span></a>
  <a href="kanji.html"><span class="ni">✍️</span><span data-i18n="nav.kanji">Kanji</span></a>
  <a href="read.html"><span class="ni">📜</span><span data-i18n="nav.read">Read</span></a>
  <a href="quiz.html"><span class="ni">❓</span><span data-i18n="nav.quiz">Quiz</span></a>
</nav>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const D = window.CJ_DATA, K = window.CJ_KANJI, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;

  function renderIntro() {
    $('introText').innerHTML = t('home.intro');
    try { $('helpNew').style.display = localStorage.getItem('cj_helpSeen') ? 'none' : ''; } catch (e) {}
  }
  function renderStats() {
    const d = CJ.getData();
    const ids = new Set(D.CARDS.map(c => c.id)), ks = new Set(K.KANJI.map(k => k.k));
    $('stLearned').textContent = d.learned.filter(x => ids.has(x)).length + '/' + D.CARDS.length;
    $('stKanji').textContent = d.kanji.filter(x => ks.has(x)).length + '/' + K.KANJI.length;
    const ws = new Set(window.CJ_WORDS.WORDS.map(w => w.id));
    $('stWords').textContent = d.words.filter(x => ws.has(x)).length + '/' + ws.size;
    $('stPref').textContent = d.pref.length;
    $('stAcc').textContent = d.quiz.total ? Math.round(d.quiz.correct / d.quiz.total * 100) + '%' : '–';
    $('stStreak').textContent = CJ.calcStreak(d.history);
    const nWrong = Object.keys(d.wrong).length;
    $('mistakeBtn').style.display = nWrong ? '' : 'none';
    $('mistakeBtn').textContent = t('home.mistakes', { n: nWrong });
  }

  // 今日のヒント：日付で決まるカードを1枚
  function renderTip() {
    const withNote = D.CARDS.filter(c => c.note);
    const n = Math.floor(new Date(CJ.dateKey() + 'T00:00:00').getTime() / 86400000);
    const c = withNote[n % withNote.length];
    $('tipBox').innerHTML =
      (c.only !== 'c' ? '<div><span class="reg polite">' + t('reg.polite') + '</span> <b class="ja">' + esc(c.p[0]) + '</b> ' + CJ.sayBtns(c.p[0]) + '</div>' : '') +
      (c.only !== 'p' ? '<div><span class="reg casual">' + t('reg.casual') + '</span> <b class="ja">' + esc(c.c[0]) + '</b> ' + CJ.sayBtns(c.c[0]) + '</div>' : '') +
      '<div class="romaji">' + esc(c.c[1]) + '</div>' +
      '<div class="muted" style="margin-top:0.3rem;">“' + esc(c.en) + '” — ' + esc(CJ.tx(c, 'note')) + '</div>';
  }

  function renderSettings() {
    const p = CJ.getPrefs();
    $('optRomaji').checked = !!p.romaji;
    $('optAuto').checked = p.autoSpeak !== false;
    document.querySelectorAll('#rateSeg button').forEach(b => b.classList.toggle('active', Math.abs(Number(b.dataset.rate) - Number(p.rate)) < 0.01));
    const lc = CJ.lang() === 'en' ? 'en' : CJ.jaStyle() === 'kanji' ? 'jk' : 'ja';
    document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('active', b.dataset.lang === lc));
    document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.theme === (p.theme || 'pink')));
    document.querySelectorAll('#vsrcSeg button').forEach(b => b.classList.toggle('active', b.dataset.vs === (p.voiceSrc || 'yoh')));
    document.querySelectorAll('#vmodeSeg button').forEach(b => b.classList.toggle('active', b.dataset.vm === (p.voiceMode || 'natural')));
    renderVoices();
    document.querySelectorAll('#secsSeg button').forEach(b => { b.textContent = t('secs', { n: b.dataset.secs }); b.classList.toggle('active', Number(b.dataset.secs) === CJ.drillSecs()); });
  }
  $('themeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { CJ.setPref('theme', b.dataset.theme); renderSettings(); } });
  $('secsSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { CJ.setPref('drillSecs', Number(b.dataset.secs)); renderSettings(); } });

  // きょう の れんしゅう（ひる／よる）の状況
  function renderToday() {
    const v = CJ.getData().daily[CJ.dateKey()] || {}, nowSlot = new Date().getHours() < 16 ? 'lunch' : 'night';
    $('homeSlots').innerHTML = ['lunch', 'night'].map(sl => {
      // よる は「カード」か「型」のどちらか おわれば できた
      const x = sl === 'night' ? ((v.night && v.night.s) ? v.night : v.pat) : v[sl], done = x && x.s;
      return '<a class="slot' + (done ? ' done' : '') + (sl === nowSlot && !done ? ' now' : '') + '" href="practice.html" style="text-decoration:none; color:inherit;">' +
        '<div class="nm">' + esc(t('slot.' + sl)) + (sl === 'lunch' ? ' ' + CJ.FOCUS_ICON[CJ.focusOf(CJ.dateKey())] : '') + '</div><div class="st" style="margin-bottom:0;">' + esc(done ? t('slot.done', { s: x.s[0], t: x.s[1] }) : t('slot.start')) + '</div></a>';
    }).join('');
  }
  $('langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) CJ.setLang(b.dataset.lang); });
  $('optRomaji').addEventListener('change', e => CJ.setPref('romaji', e.target.checked));
  $('optAuto').addEventListener('change', e => CJ.setPref('autoSpeak', e.target.checked));
  $('rateSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    CJ.setPref('rate', Number(b.dataset.rate)); renderSettings();
    CJ.speak('こんにちは');
  });

  let voiceChecked = false;
  function checkVoice() {
    voiceChecked = true;
    const n = $('voiceNotice');
    if (!('speechSynthesis' in window)) { n.style.display = ''; n.textContent = t('voice.noTts'); return; }
    if (!CJ.hasJaVoice()) { n.style.display = ''; n.innerHTML = t('voice.none'); }
    else n.style.display = 'none';
  }
  $('testVoice').addEventListener('click', () => { CJ.ttsSpeak('いま どこ？'); setTimeout(checkVoice, 500); });
  // 声のえらびかた（端末に入っている日本語の声）
  function renderVoices() {
    const list = CJ.jaVoices(), want = CJ.getPrefs().voiceName;
    $('voiceSel').innerHTML = '<option value="">' + esc(t('set.voiceAuto')) + (list[0] ? '：' + esc(list[0].name) : '') + '</option>' +
      list.map(v => '<option value="' + esc(v.name) + '"' + (v.name === want ? ' selected' : '') + '>' + esc(v.name) + '</option>').join('');
  }
  if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', renderVoices);
  $('voiceSel').addEventListener('change', e => { CJ.setPref('voiceName', e.target.value); CJ.ttsSpeak('いま どこ？'); });
  $('vmodeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; CJ.setPref('voiceMode', b.dataset.vm); renderSettings(); CJ.ttsSpeak('いま どこ？'); });
  // ようちゃん の声 ／ 機械の声 の切り替え と、聞きくらべ
  $('vsrcSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; CJ.setPref('voiceSrc', b.dataset.vs); renderSettings(); CJ.markVoiceButtons(); });
  $('testYoh').addEventListener('click', () => { const was = CJ.getPrefs().voiceSrc; CJ.setPref('voiceSrc', 'yoh'); if (!CJ.hasVoice('いま どこ？')) CJ.toast(t('vsrc.noYoh')); else CJ.speak('いま どこ？'); CJ.setPref('voiceSrc', was); });
  // version を 5回 タップ → ようちゃん モード（録音・バックアップ を表示）
  let verTaps = 0, verTimer = 0;
  $('verText').addEventListener('click', () => {
    verTaps++; clearTimeout(verTimer); verTimer = setTimeout(() => { verTaps = 0; }, 1500);
    if (verTaps >= 5) { verTaps = 0; CJ.setDev(!CJ.isDev()); CJ.toast(t(CJ.isDev() ? 'dev.on' : 'dev.off')); }
  });

  $('exportBtn').addEventListener('click', () => { CJ.downloadBackup(); CJ.toast(t('bk.done')); });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const mode = document.querySelector('input[name="importMode"]:checked').value;
    const st = $('importStatus');
    if (mode === 'replace' && !confirm(t('bk.confirm'))) { e.target.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      try { const d = CJ.importBackup(String(r.result), mode); st.className = 'status-msg ok'; st.textContent = t('bk.loaded', { c: d.learned.length, k: d.kanji.length }); renderStats(); }
      catch (err) { st.className = 'status-msg error'; st.textContent = err.message; }
      e.target.value = '';
    };
    r.readAsText(f);
  });

  function renderAll() { $('verText').textContent = 'version ' + CJ.APP_VERSION; renderToday(); renderIntro(); renderStats(); renderTip(); renderSettings(); if (voiceChecked) checkVoice(); }
  document.addEventListener('cj:lang', renderAll);
  renderAll();
  // 音声の一覧は少し遅れて読み込まれることがある
  setTimeout(checkVoice, 800);
})();
</script>
</body>
</html>
