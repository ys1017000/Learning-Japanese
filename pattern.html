<script src="i18n.js"></script>
<script src="grammar-data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="pattern-data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const PT = window.CJ_PATTERNS, G = window.CJ_GRAMMAR.GRAMMAR, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  let pid = new URLSearchParams(location.search).get('p');
  if (!PT.PATTERNS.some(p => p.id === pid)) pid = PT.PATTERNS[0].id;
  const flipped = {};
  let sel = -1;   // タップして ［A］ に入れた ことば（-1 = まだ）
  const cur = () => PT.PATTERNS.find(p => p.id === pid);
  const itemsOf = id => PT.items.filter(it => it.pid === id);
  // この型で、練習カードで「言えた」文の数
  function progress(id) { const prac = CJ.getData().prac, its = itemsOf(id); return { said: its.filter(it => prac[it.key] && prac[it.key].l === 'ok').length, all: its.length }; }

  function renderSel() {
    $('ptSel').innerHTML = PT.PATTERNS.map(p => { const pr = progress(p.id); return '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + p.icon + ' ' + esc(CJ.tx(p, 'title')) + '（' + pr.said + '/' + pr.all + '）</option>'; }).join('');
  }
  // 型を大きく表示：［　］ が入れ替える場所
  // 覚える のは 型 の ぶぶん（が たべたい な）→ ピンク で 目立たせる。ことば の ところ は うすい ＿＿（タップ した ことば が 入る）
  function slotHtml(form) {
    const k = CJ.showKanji(), raw = k ? form[2] : form[0], w = sel >= 0 ? cur().fill[sel] : null;
    const word = (v, lab) => '<span class="pt-word">' + (v ? (k ? CJ.ruby(v[2]) : esc(v[0])) : lab) + '</span>';
    return raw.split(/(\{X\}|\{Y\})/).map(seg => {
      if (seg === '{X}') return word(w && w.x, raw.includes('{Y}') ? 'A' : '＿＿');
      if (seg === '{Y}') return word(w && w.y, 'B');
      return seg.trim() ? '<span class="pt-frm">' + (k ? CJ.ruby(seg) : esc(seg)) + '</span>' : seg;
    }).join('');
  }

  function renderFrame() {
    const p = cur(), g = G.find(x => x.id === p.g), pr = progress(p.id);
    const words = p.fill.map(f => f.y ? CJ.esc(f.x[0]) + ' ⇄ ' + CJ.esc(f.y[0]) : CJ.esc(f.x[0]));
    $('frame').innerHTML = '<div style="text-align:center;"><div style="font-size:1.8rem;">' + p.icon + '</div>' +
      '<div class="muted">' + esc(t('reg.casual')) + '</div><div class="pt-frame ja">' + slotHtml(p.c) + '</div>' +
      '<div class="muted" style="margin-top:0.3rem;">' + esc(t('reg.polite')) + '</div><div class="pt-frame small ja">' + slotHtml(p.p) + '</div>' +
      '<div style="margin-top:0.4rem; font-weight:700;">' + esc(sel >= 0 ? itemsOf(p.id)[sel].en : p.title) + '</div>' +
      (sel >= 0 ? CJ.sayBtns(itemsOf(p.id)[sel].c[0]) : '') + '</div>' +
      '<div style="margin-top:0.7rem; font-weight:700; font-size:0.85rem;">' + esc(t('pt.words')) + '</div><div class="link-row">' + words.map((x, i) => '<button class="link-chip' + (i === sel ? ' on' : '') + '" data-fill="' + i + '">' + x + '</button>').join('') + '</div>' +
      (g ? '<div style="margin-top:0.6rem;"><a class="link-chip" href="grammar.html?g=' + g.id + '">🧩 ' + esc(CJ.tx(g, 'title')) + ' →</a></div>' : '') +
      '<p class="muted" style="margin-top:0.5rem;">' + esc(t('pt.progress', { n: pr.said, m: pr.all })) + '</p>' +
      '<a class="btn" href="practice.html?pt=' + p.id + '" style="margin-top:0.4rem;">' + esc(t('pt.practice')) + '</a>';
  }
  function renderList() { $('list').innerHTML = itemsOf(pid).map(it => CJ.flipHtml(it.key, it, !!flipped[it.key])).join(''); }
  function render() { renderSel(); renderFrame(); renderList(); }

  $('ptSel').addEventListener('change', e => { pid = e.target.value; sel = -1; render(); });
  $('frame').addEventListener('click', e => {
    const b = e.target.closest('[data-fill]'); if (!b) return;
    sel = Number(b.dataset.fill); renderFrame(); CJ.autoSpeak(itemsOf(pid)[sel].c[0]);
  });
  $('list').addEventListener('click', e => {
    if (e.target.closest('[data-say], a')) return;
    const c = e.target.closest('[data-flip]'); if (!c) return;
    flipped[c.dataset.flip] = !flipped[c.dataset.flip]; renderList();
  });
  document.addEventListener('cj:lang', render);
  document.addEventListener('cj:kanji', render);
  render();
  CJ.markStudied();
})();
</script>
</body>
</html>
