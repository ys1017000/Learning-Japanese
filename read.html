<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Read aloud – マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="card">
    <h2 data-i18n="rd.title"></h2>
    <p data-i18n="rd.intro"></p>
    <div class="notice" id="noMic" style="display:none;" data-i18n="rd.noMic"></div>
  </div>

  <select class="pick" id="pSel" aria-label="Conversation"></select>

  <div class="card" id="pBox">
    <div class="rd-head">
      <b id="pTitle"></b>
      <button class="tiny-btn" id="playAll"></button>
    </div>
    <div style="margin-bottom:0.3rem;"><label class="kj-toggle"><input type="checkbox" data-kanji-toggle> <span data-i18n="rd.kanji"></span></label></div>
    <div class="chip-row" style="margin:0.5rem 0 0.2rem;">
      <button class="chip" id="allC" data-i18n="rd.allC"></button>
      <button class="chip" id="allP" data-i18n="rd.allP"></button>
    </div>
    <div class="tap-hint" data-i18n="tap.hint"></div>
    <div id="lines"></div>
    <div class="muted" id="doneText" style="text-align:center; margin-top:0.4rem;"></div>
  </div>
  <p class="muted" data-i18n="rd.hint"></p>
</main>

<nav>
  <a href="index.html"><span class="ni">🏠</span><span data-i18n="nav.home">Home</span></a>
  <a href="practice.html"><span class="ni">🔥</span><span data-i18n="nav.today">Today</span></a>
  <a href="cards.html"><span class="ni">📚</span><span data-i18n="nav.learn">Learn</span></a>
  <a href="kanji.html"><span class="ni">✍️</span><span data-i18n="nav.kanji">Kanji</span></a>
  <a href="read.html" class="active"><span class="ni">🗣️</span><span data-i18n="nav.read">Read</span></a>
  <a href="quiz.html"><span class="ni">❓</span><span data-i18n="nav.quiz">Quiz</span></a>
</nav>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="grammar-data.js"></script>
<script src="read-data.js"></script>
<script src="examples-data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script src="bank.js"></script>
<script>
(function () {
  const R = window.CJ_READ, K = window.CJ_KANJI, B = window.CJ_BANK, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  let pid = new URLSearchParams(location.search).get('p');
  if (!R.PASSAGES.some(p => p.id === pid)) pid = R.PASSAGES[0].id;
  let playing = false, listeningIdx = -1, curRec = null;
  const openExt = {};     // 行番号 → 🎬（アプリの外のリンク）を開いているか
  let regs = {};          // 行番号 → 'c'（ふつう）/ 'p'（ていねい）。カードをタップで切り替え
  const results = {};     // 行番号 → { score, heard }（このページを開いている間だけ）
  const P = () => R.PASSAGES.find(p => p.id === pid);
  const regOf = n => regs[n] || 'c';
  const form = (l, n) => l[regOf(n) === 'p' ? 2 : 1];   // [ひらがな, ローマ字, 漢字の書き方]
  const key = n => pid + ':' + n + ':' + regOf(n);

  if (!CJ.recognitionSupported) $('noMic').style.display = '';

  // 会話は「えらぶ」（セレクト）にする
  function renderTabs() {
    $('pSel').innerHTML = R.PASSAGES.map(p => '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + p.icon + ' ' + esc(CJ.tx(p, 'title')) + '</option>').join('');
  }

  function resultHtml(n) {
    const r = results[n];
    if (listeningIdx === n) return '<div class="rd-result show">' + esc(t('rd.listening')) + (r && r.interim ? '<div class="muted">' + esc(r.interim) + '</div>' : '') + '</div>';
    if (!r || (!r.err && typeof r.score !== 'number')) return '<div class="rd-result"></div>';
    if (r.err) return '<div class="rd-result show" style="color:var(--bad);">' + esc(r.err) + '</div>';
    const ok = r.score >= CJ.PASS_SCORE;
    return '<div class="rd-result show"><span class="sc ' + (ok ? 'ok' : 'ng') + '">' + esc(t(ok ? 'rd.pass' : 'rd.retry', { s: r.score })) + '</span>' +
      '<div class="muted">' + esc(t('rd.heard', { t: r.heard })) + '</div></div>';
  }

  function render() {
    renderTabs();
    const p = P(), best = CJ.getData().read;
    $('pTitle').textContent = p.icon + ' ' + CJ.tx(p, 'title');
    $('playAll').textContent = t(playing ? 'rd.stop' : 'rd.playAll');
    const allReg = p.lines.every((l, n) => regOf(n) === 'p') ? 'p' : p.lines.every((l, n) => regOf(n) === 'c') ? 'c' : '';
    $('allC').classList.toggle('active', allReg === 'c'); $('allP').classList.toggle('active', allReg === 'p');
    $('lines').innerHTML = p.lines.map((l, n) => {
      const f = form(l, n), isP = regOf(n) === 'p', same = l[1][0] === l[2][0], b = best[key(n)];
      return '<div class="rd-line flip ' + (isP ? 'is-p' : 'is-c') + '" id="line' + n + '" data-line="' + n + '">' +
        '<div class="flip-top"><span class="reg ' + (isP ? 'polite' : 'casual') + '">' + t(isP ? 'reg.polite' : 'reg.casual') + '</span>' +
          '<span class="flip-hint">' + esc(same ? t('tap.same') : t('tap.short')) + '</span></div>' +
        '<div class="k ja">' + CJ.jaHtml(f) + '</div>' +
        '<div class="romaji">' + esc(f[1]) + '</div><div class="e">' + esc(l[0]) + '</div>' +
        '<div class="rd-tools">' + CJ.sayBtns(f[0]) +
          (CJ.recognitionSupported ? '<button class="mic-btn' + (listeningIdx === n ? ' on' : '') + '" data-mic="' + n + '" aria-label="' + esc(t('rd.mic')) + '">🎙️</button>' : '') +
          '<button class="icon-btn" data-ext="' + n + '" aria-label="' + esc(t('kj.native')) + '">🎬</button>' + CJ.askLink(f[0] + ' (' + l[0] + ')') +
          (b ? '<span class="rd-best">' + (b >= CJ.PASS_SCORE ? '⭐ ' : '') + esc(t('rd.best', { s: b })) + '</span>' : '') +
        '</div>' + (openExt[n] ? CJ.extLinks(f) : '') + B.linksHtml(B.byKey['rd:' + pid + ':' + n], 6) + resultHtml(n) + '</div>';
    }).join('');
    const good = p.lines.filter((l, n) => (best[key(n)] || 0) >= CJ.PASS_SCORE).length;
    $('doneText').textContent = CJ.recognitionSupported ? t('rd.done', { n: good, m: p.lines.length }) : '';
  }

  function check(n) {
    if (listeningIdx === n) { if (curRec) curRec.stop(); return; }   // もう一度押すと聞き取りを終える（その時点までで採点）
    if (curRec) { try { curRec.abort(); } catch (e) {} }
    stopAll();
    const l = P().lines[n], f = form(l, n), k = key(n);
    listeningIdx = n; results[n] = { interim: '' }; render();
    const rec = CJ.listen({
      onInterim: s => { if (results[n]) results[n].interim = s; const el = document.querySelector('#line' + n + ' .rd-result .muted'); if (el) el.textContent = s; else render(); },
      onFinal: alts => {
        // ひらがな と 漢字の書き方 の両方と比べる（スマホは漢字で聞き取ることが多い）
        const r = CJ.scoreJa([f[0], K.plain(f[2])], alts);
        results[n] = r;
        CJ.recordRead(k, r.score);
      },
      onError: m => { results[n] = { err: m }; },
      onState: on => { if (!on && curRec === rec) { curRec = null; listeningIdx = -1; render(); } }
    });
    curRec = rec;
    if (!rec) { listeningIdx = -1; render(); }
  }

  // ぜんぶ きく：いま表示している言い方で、1行ずつ順番に読み上げる
  function stopAll() {
    if (!playing) return;
    playing = false; CJ.stopSpeak();
    document.querySelectorAll('.rd-line.playing').forEach(el => el.classList.remove('playing'));
    $('playAll').textContent = t('rd.playAll');
  }
  function playFrom(n) {
    const lines = P().lines;
    document.querySelectorAll('.rd-line.playing').forEach(el => el.classList.remove('playing'));
    if (!playing || n >= lines.length) { stopAll(); return; }
    const el = $('line' + n);
    if (el) { el.classList.add('playing'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    const ok = CJ.speak(form(lines[n], n)[0], false, () => setTimeout(() => playFrom(n + 1), 450));
    if (!ok) { stopAll(); CJ.toast(t('toast.noSpeech')); }
  }
  $('playAll').addEventListener('click', () => {
    if (playing) { stopAll(); return; }
    playing = true; $('playAll').textContent = t('rd.stop'); playFrom(0); CJ.markStudied();
  });

  function resetFor(newPid) { stopAll(); pid = newPid; regs = {}; Object.keys(openExt).forEach(k => delete openExt[k]); Object.keys(results).forEach(k => delete results[k]); listeningIdx = -1; render(); }
  $('pSel').addEventListener('change', e => resetFor(e.target.value));
  $('lines').addEventListener('click', e => {
    const m = e.target.closest('[data-mic]'); if (m) { check(Number(m.dataset.mic)); return; }
    const x = e.target.closest('[data-ext]'); if (x) { openExt[x.dataset.ext] = !openExt[x.dataset.ext]; render(); return; }
    if (e.target.closest('[data-say], a')) return;   // 🔊 やリンクは切り替えない
    const c = e.target.closest('[data-line]'); if (!c || listeningIdx >= 0) return;
    const n = Number(c.dataset.line);
    regs[n] = regOf(n) === 'p' ? 'c' : 'p';
    delete results[n];
    render();
  });
  const setAll = r => { stopAll(); P().lines.forEach((l, n) => { regs[n] = r; delete results[n]; }); render(); };
  $('allC').addEventListener('click', () => setAll('c'));
  $('allP').addEventListener('click', () => setAll('p'));
  document.addEventListener('cj:kanji', render);
  document.addEventListener('cj:lang', render);
  render();
})();
</script>
</body>
</html>
