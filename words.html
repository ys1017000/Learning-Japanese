<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Words – マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="subnav">
    <a href="kanji.html" data-i18n="sub.kanji">Kanji</a>
    <a href="words.html" class="active" data-i18n="sub.words">Words</a>
    <a href="map.html" data-i18n="sub.map">Map</a>
  </div>
  <div class="card">
    <h2 data-i18n="wd.title"></h2>
    <p class="muted" data-i18n="wd.intro"></p>
  </div>
  <select class="pick" id="catSel" aria-label="Category"></select>

  <div class="card" id="detail" style="scroll-margin-top:72px;"></div>

  <div class="counter"><span class="muted" id="countText"></span><button class="tiny-btn" id="furiBtn"></button></div>
  <div class="wd-list" id="list"></div>
  <a class="btn" href="quiz.html?mode=words" style="margin-top:1rem;">❓ <span data-i18n="mode.words"></span></a>
</main>

<nav>
  <a href="index.html"><span class="ni">🏠</span><span data-i18n="nav.home">Home</span></a>
  <a href="practice.html"><span class="ni">🔥</span><span data-i18n="nav.today">Today</span></a>
  <a href="cards.html"><span class="ni">📚</span><span data-i18n="nav.learn">Learn</span></a>
  <a href="kanji.html" class="active"><span class="ni">✍️</span><span data-i18n="nav.kanji">Kanji</span></a>
  <a href="read.html"><span class="ni">🗣️</span><span data-i18n="nav.read">Read</span></a>
  <a href="quiz.html"><span class="ni">❓</span><span data-i18n="nav.quiz">Quiz</span></a>
</nav>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="grammar-data.js"></script>
<script src="read-data.js"></script>
<script src="examples-data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script src="bank.js"></script>
<script>
(function () {
  const WD = window.CJ_WORDS, B = window.CJ_BANK, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  const want = new URLSearchParams(location.search).get('w');
  let cat = 'all', list = [], i = 0, hideFuri = false, showAll = false;
  const flipped = {};
  if (want && B.wordBy[want]) cat = B.wordBy[want].cat;

  const learnedSet = () => new Set(CJ.getData().words);
  function setList(keep) {
    const l = learnedSet();
    list = WD.WORDS.filter(w => cat === 'all' ? true : cat === 'todo' ? !l.has(w.id) : w.cat === cat);
    i = 0;
    if (keep) { const n = list.findIndex(w => w.id === keep); if (n >= 0) i = n; }
    showAll = false;
  }
  function renderCats() {
    const l = learnedSet();
    const opts = [['all', t('wd.all', { n: WD.WORDS.length })], ['todo', t('wd.todo', { n: WD.WORDS.filter(w => !l.has(w.id)).length })]]
      .concat(WD.CATS.map(c => [c.id, CJ.tx(c, 'label') + '（' + WD.WORDS.filter(w => w.cat === c.id).length + '）']));
    $('catSel').innerHTML = opts.map(o => '<option value="' + o[0] + '"' + (o[0] === cat ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');
  }
  function renderDetail() {
    const w = list[i], box = $('detail');
    if (!w) { box.innerHTML = '<p>' + esc(t('cards.allDone')) + '</p>'; return; }
    const learned = learnedSet().has(w.id);
    const ks = Array.from(new Set(Array.from(w.id).filter(ch => B.kanjiBy[ch])));
    const sents = B.withWord(w), shown = showAll ? sents : sents.slice(0, 5);
    box.innerHTML =
      '<div class="counter"><span class="muted">' + (i + 1) + ' / ' + list.length + '</span><span>' + CJ.askLink('単語 ' + w.id + '（' + w.kana + '）') + '<span class="learned-mark">' + (learned ? ' ✓' : '') + '</span></span></div>' +
      '<div class="wd-big ja">' + CJ.ruby(w.kj) + '</div>' +
      '<div style="text-align:center;"><div class="romaji">' + esc(w.r) + '</div><div style="font-weight:700;">' + esc(w.en) + '</div>' + CJ.sayBtns(w.kana) + '</div>' +
      (ks.length ? '<div style="font-weight:700; margin:0.7rem 0 0.2rem;">' + esc(t('wd.kanji')) + '</div><div class="link-row">' +
        ks.map(k => '<a class="link-chip kj" href="kanji.html?k=' + encodeURIComponent(k) + '">✍️ ' + esc(k) + ' · ' + esc(B.kanjiBy[k].m) + '</a>').join('') + '</div>' : '') +
      '<div style="font-weight:700; margin:0.8rem 0 0.2rem;">' + esc(t('kj.sentences', { n: sents.length })) + '</div>' +
      '<div class="tap-hint">' + esc(t('tap.hint')) + '</div>' +
      shown.map(it => CJ.flipHtml(it.key, it, !!flipped[it.key])).join('') +
      (sents.length > shown.length ? '<button class="tiny-btn" data-act="more">＋ ' + (sents.length - shown.length) + '</button>' : '') +
      '<div style="font-weight:700; margin:0.8rem 0 0;">' + esc(t('kj.native')) + '</div>' + CJ.extLinks([w.kana, w.r, w.kj]) +
      '<div class="btn-row"><button class="btn btn-secondary" data-act="prev" aria-label="prev">←</button>' +
      '<button class="btn ' + (learned ? 'btn-secondary' : 'btn-ok') + '" data-act="learn" style="flex:3;">' + esc(t(learned ? 'wd.unknow' : 'wd.know')) + '</button>' +
      '<button class="btn btn-secondary" data-act="next" aria-label="next">→</button></div>';
  }
  function renderList() {
    const l = learnedSet();
    $('list').innerHTML = list.map((w, n) => '<div class="wd-item' + (l.has(w.id) ? ' learned' : '') + (n === i ? ' current' : '') + '" data-n="' + n + '" role="button" tabindex="0">' +
      '<span class="k ja">' + CJ.ruby(w.kj) + '</span><span class="e">' + esc(w.en) + '</span>' + (l.has(w.id) ? '<span class="learned-mark">✓</span>' : '') + '</div>').join('');
    $('countText').textContent = t('wd.count', { n: list.filter(w => l.has(w.id)).length, m: list.length });
    $('furiBtn').textContent = t(hideFuri ? 'kj.showFuri' : 'kj.hideFuri');
  }
  function render() { renderCats(); renderDetail(); renderList(); }

  $('catSel').addEventListener('change', e => { cat = e.target.value; setList(); render(); });
  $('list').addEventListener('click', e => {
    const r = e.target.closest('[data-n]'); if (!r) return;
    i = Number(r.dataset.n); showAll = false; renderDetail(); renderList();
    $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    CJ.markStudied();
  });
  $('detail').addEventListener('click', e => {
    if (e.target.closest('[data-say], a')) return;
    const f = e.target.closest('[data-flip]');
    if (f) { flipped[f.dataset.flip] = !flipped[f.dataset.flip]; renderDetail(); return; }
    const b = e.target.closest('[data-act]'); if (!b || !list.length) return;
    if (b.dataset.act === 'more') { showAll = true; renderDetail(); return; }
    if (b.dataset.act === 'prev') i = (i - 1 + list.length) % list.length;
    else if (b.dataset.act === 'next') i = (i + 1) % list.length;
    else if (b.dataset.act === 'learn') {
      const on = CJ.toggleWord(list[i].id);
      CJ.toast(t(on ? 'toast.learned' : 'toast.unlearned'));
      if (cat === 'todo') { setList(); i = Math.min(i, Math.max(0, list.length - 1)); }
      else if (on) i = (i + 1) % list.length;
    }
    showAll = false; render();
  });
  $('furiBtn').addEventListener('click', () => { hideFuri = !hideFuri; document.body.classList.toggle('hide-furi', hideFuri); renderList(); });
  document.addEventListener('cj:lang', render);
  document.addEventListener('cj:kanji', renderDetail);
  setList(want); render();
})();
</script>
</body>
</html>
