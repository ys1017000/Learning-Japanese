<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz – マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <div class="chip-row" id="modeRow" role="group"></div>
  <div class="counter"><span class="muted" id="counter"></span><span class="muted" id="scoreNow"></span></div>
  <div class="progress"><div id="progFill"></div></div>
  <div class="card" id="qBox"></div>
</main>

<nav>
  <a href="index.html"><span class="ni">🏠</span><span data-i18n="nav.home">Home</span></a>
  <a href="practice.html"><span class="ni">🔥</span><span data-i18n="nav.today">Today</span></a>
  <a href="cards.html"><span class="ni">📚</span><span data-i18n="nav.learn">Learn</span></a>
  <a href="kanji.html"><span class="ni">✍️</span><span data-i18n="nav.kanji">Kanji</span></a>
  <a href="read.html"><span class="ni">🗣️</span><span data-i18n="nav.read">Read</span></a>
  <a href="quiz.html" class="active"><span class="ni">❓</span><span data-i18n="nav.quiz">Quiz</span></a>
</nav>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const D = window.CJ_DATA, K = window.CJ_KANJI, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  const ROUND = 10;
  const MODES = ['who', 'endings', 'kanji', 'words', 'mistakes'];
  const WORDS = window.CJ_WORDS.WORDS, wordBy = {}; WORDS.forEach(w => { wordBy[w.id] = w; });
  const cardById = {}; D.CARDS.forEach(c => { cardById[c.id] = c; });
  const endById = {}; D.ENDING_QUIZ.forEach(q => { endById[q.id] = q; });
  const kanjiBy = {}; K.KANJI.forEach(x => { kanjiBy[x.k] = x; });
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let mode = new URLSearchParams(location.search).get('mode');
  if (!MODES.includes(mode)) mode = 'who';
  let qs = [], qi = 0, score = 0, answered = -1, lastOk = false, rightMsg = '';

  /* ---- 問題を作る ----
     問題 = { id, opts: [{ t: [表示, ふりがな/ローマ字], ok }], answer: 読み上げる文, head(), why() }
     head / why は関数にして、言語を切り替えたときにその言語で描き直せるようにする */

  // 「誰と話している？」：相手に合う言い方（ていねい／ふつう）を選ぶ。reg を省略すると相手をランダムに選ぶ
  function whoQuestion(c, reg) {
    if (!reg) reg = c.pw.length && Math.random() < 0.5 ? 'polite' : 'casual';
    if (reg === 'polite' && !c.pw.length) reg = 'casual';
    const P = D.PEOPLE[reg === 'polite' ? pick(c.pw) : pick(['yoh', 'friend'])];
    const right = reg === 'polite' ? c.p : c.c, other = reg === 'polite' ? c.c : c.p;
    const others = CJ.shuffle(D.CARDS.filter(x => x.id !== c.id && x.c[0] !== right[0]));
    const d1 = reg === 'polite' ? others[0].p : others[0].c;   // 同じていねいさ・違う意味
    const d2 = reg === 'polite' ? others[1].c : others[1].p;   // 違うていねいさ・違う意味
    return {
      id: 'c:' + c.id + ':' + reg,
      opts: CJ.shuffle([{ t: right, ok: true }, { t: other }, { t: d1 }, { t: d2 }].filter((o, k, arr) => arr.findIndex(z => z.t[0] === o.t[0]) === k)),   // 同じ文は1つに
      answer: right[0],
      head: () => '<div class="q-who">' + P.icon + '</div><div class="q-text">' + esc(t('q.talkingTo', { who: CJ.tx(P, 'label') })) + '</div>' +
        '<div class="q-say">' + t('q.wantSay', { en: esc(c.en) }) + '</div>',
      why: () => {
        const tag = '<span class="reg ' + reg + '">' + t(reg === 'polite' ? 'reg.polite' : 'reg.casual') + '</span>';
        const note = CJ.tx(c, 'note');
        return t(reg === 'polite' ? 'q.whyPolite' : 'q.whyCasual', { who: esc(CJ.tx(P, 'label')), tag }) +
          '<div style="margin-top:0.4rem;" class="ja">' + (c.only ? esc(c.c[0]) : esc(c.p[0]) + ' ⇔ ' + esc(c.c[0])) + '</div>' +
          (note ? '<div class="muted" style="margin-top:0.3rem;">💡 ' + esc(note) + '</div>' : '');
      }
    };
  }
  function endQuestion(q) {
    return {
      id: 'e:' + q.id,
      opts: CJ.shuffle([{ t: q.a, ok: true }].concat(q.w.map(w => ({ t: w })))),
      answer: q.a[0],
      head: () => '<div class="q-who">💬</div><div class="q-text">' + esc(CJ.tx(q, 'q')) + '</div><div class="q-say">' + esc(t('q.whichRight')) + '</div>',
      why: () => esc(CJ.tx(q, 'why'))
    };
  }
  // 漢字の読み上げ用（くんよみ、なければ おんよみ の最初）
  function sayOf(x) { return (x.kun || x.on).split('・')[0].replace(/[()]/g, ''); }
  function readings(x) { return [x.kun, x.on].filter(Boolean).join('・'); }
  // 漢字：type 'm' = 意味を選ぶ / 'r' = 言葉の読み方を選ぶ
  function kanjiQuestion(x, type) {
    if (!type) type = Math.random() < 0.5 ? 'm' : 'r';
    if (type === 'm') {
      const wrong = CJ.shuffle(K.KANJI.filter(y => y.k !== x.k && y.m !== x.m)).slice(0, 3);
      return {
        id: 'k:' + x.k + ':m',
        opts: CJ.shuffle([{ t: [x.m, ''], ok: true }].concat(wrong.map(y => ({ t: [y.m, ''] })))),
        answer: sayOf(x),
        head: () => '<div class="q-text">' + esc(t('q.kMeaning')) + '</div><div class="q-kanji">' + esc(x.k) + '</div>',
        why: () => esc(t('q.kWhy', { k: x.k, m: x.m, r: readings(x) })) + '<div class="muted" style="margin-top:0.3rem;">🎨 ' + esc(x.img) + '</div>' +
          '<div style="margin-top:0.4rem;"><a href="kanji.html?k=' + encodeURIComponent(x.k) + '">✍️ ' + esc(x.k) + ' →</a></div>'
      };
    }
    const w = pick(x.words), rd = K.reading(w[0]);
    const pool = [];
    CJ.shuffle(K.KANJI.filter(y => y.k !== x.k)).forEach(y => y.words.forEach(v => { const r = K.reading(v[0]); if (r !== rd && !pool.some(p => p[0] === r)) pool.push([r, v[1]]); }));
    return {
      id: 'k:' + x.k + ':r',
      opts: CJ.shuffle([{ t: [rd, w[1]], ok: true }].concat(pool.slice(0, 3).map(p => ({ t: p })))),
      answer: rd,
      head: () => '<div class="q-text">' + esc(t('q.kRead')) + '</div><div class="q-word ja">' + esc(K.plain(w[0])) + '</div>',
      why: () => '<div class="ja" style="font-size:1.4rem; font-weight:700;">' + K.rubyHtml(w[0], esc) + '</div>' + esc(w[2]) +
        '<div style="margin-top:0.4rem;"><a href="kanji.html?k=' + encodeURIComponent(x.k) + '">✍️ ' + esc(x.k) + ' →</a></div>'
    };
  }
  // 単語：いみ を えらぶ
  function wordQuestion(w) {
    const wrong = CJ.shuffle(WORDS.filter(y => y.id !== w.id && y.en !== w.en)).slice(0, 3);
    return {
      id: 'w:' + w.id,
      opts: CJ.shuffle([{ t: [w.en, ''], ok: true }].concat(wrong.map(y => ({ t: [y.en, ''] })))),
      answer: w.kana,
      head: () => '<div class="q-text">' + esc(t('q.wMeaning')) + '</div><div class="q-word ja">' + CJ.ruby(w.kj) + '</div>',
      why: () => '<div class="ja" style="font-size:1.3rem; font-weight:700;">' + CJ.ruby(w.kj) + '</div>' + esc(w.r) + ' = ' + esc(w.en) +
        '<div style="margin-top:0.4rem;"><a href="words.html?w=' + encodeURIComponent(w.id) + '">📝 ' + esc(w.id) + ' →</a></div>'
    };
  }
  function fromId(id) {
    const m = id.split(':');
    if (m[0] === 'c' && cardById[m[1]]) return whoQuestion(cardById[m[1]], m[2]);
    if (m[0] === 'e' && endById[m[1]]) return endQuestion(endById[m[1]]);
    if (m[0] === 'k' && kanjiBy[m[1]]) return kanjiQuestion(kanjiBy[m[1]], m[2]);
    if (m[0] === 'w' && wordBy[m[1]]) return wordQuestion(wordBy[m[1]]);
    return null;
  }
  function mistakeIds() { return Object.keys(CJ.getData().wrong).filter(id => fromId(id)); }

  function start() {
    if (mode === 'who') qs = CJ.shuffle(D.CARDS).slice(0, ROUND).map(c => whoQuestion(c));
    else if (mode === 'endings') qs = CJ.shuffle(D.ENDING_QUIZ).slice(0, ROUND).map(endQuestion);
    else if (mode === 'kanji') {
      // おぼえた漢字があれば、半分くらいはそこから出す
      const learned = new Set(CJ.getData().kanji);
      const mine = CJ.shuffle(K.KANJI.filter(x => learned.has(x.k))).slice(0, ROUND / 2);
      const rest = CJ.shuffle(K.KANJI.filter(x => !mine.includes(x))).slice(0, ROUND - mine.length);
      qs = CJ.shuffle(mine.concat(rest)).map(x => kanjiQuestion(x));
    }
    else if (mode === 'words') {
      const learned = new Set(CJ.getData().words);
      const mine = CJ.shuffle(WORDS.filter(w => learned.has(w.id))).slice(0, ROUND / 2);
      qs = CJ.shuffle(mine.concat(CJ.shuffle(WORDS.filter(w => !mine.includes(w))).slice(0, ROUND - mine.length))).map(wordQuestion);
    }
    else qs = CJ.shuffle(mistakeIds()).slice(0, ROUND).map(fromId);
    qi = 0; score = 0; answered = -1;
    render();
  }

  function renderModes() {
    const n = mistakeIds().length;
    $('modeRow').innerHTML = MODES.map(m => '<button class="chip' + (m === mode ? ' active' : '') + '" data-m="' + m + '">' +
      esc(t('mode.' + m, { n })) + '</button>').join('');
  }

  function render() {
    renderModes();
    const box = $('qBox');
    if (!qs.length) {
      $('counter').textContent = ''; $('scoreNow').textContent = ''; $('progFill').style.width = '0%';
      box.innerHTML = '<p>' + esc(t('q.noMistakes')) + '</p><p class="muted" style="margin-top:0.4rem;">' + esc(t('q.noMistakesSub')) + '</p>' +
        '<button class="btn" data-act="mode" data-m="who" style="margin-top:1rem;">' + esc(t('q.playWho')) + '</button>';
      return;
    }
    if (qi >= qs.length) return renderEnd();
    const q = qs[qi];
    $('counter').textContent = t('q.num', { i: qi + 1, n: qs.length });
    $('scoreNow').textContent = '⭕ ' + score;
    $('progFill').style.width = (qi / qs.length * 100) + '%';
    box.innerHTML = q.head() + '<div class="options">' + q.opts.map((o, k) => {
      let cls = 'option-btn';
      if (answered >= 0) { if (o.ok) cls += ' correct'; else if (k === answered) cls += ' wrong'; }
      return '<button class="' + cls + '" data-k="' + k + '"' + (answered >= 0 ? ' disabled' : '') + '><span class="k ja">' + esc(o.t[0]) + '</span>' +
        (o.t[1] ? '<span class="romaji">' + esc(o.t[1]) + '</span>' : '') + '</button>';
    }).join('') + '</div><div class="feedback" id="fb"></div>';
    if (answered >= 0) renderFeedback();
  }

  function renderFeedback() {
    const q = qs[qi], fb = $('fb');
    fb.className = 'feedback ' + (lastOk ? 'correct' : 'wrong');
    fb.innerHTML = '<b>' + esc(lastOk ? rightMsg : t('q.wrong')) + '</b>' + q.why() +
      '<div style="margin-top:0.5rem;">' + CJ.sayBtns(q.answer) + '</div>' +
      '<button class="btn" data-act="next" style="margin-top:0.7rem;">' + esc(t(qi + 1 < qs.length ? 'q.next' : 'q.seeScore')) + '</button>';
  }

  function answer(k) {
    if (answered >= 0) return;
    const q = qs[qi], ok = !!q.opts[k].ok;
    answered = k; lastOk = ok; rightMsg = pick(t('q.right').split('|'));
    if (ok) score++;
    CJ.recordQuiz(q.id, ok);
    render();
    // 答えの説明と「Next」が画面の下に隠れないようにスクロール
    const nb = $('fb').querySelector('[data-act="next"]');
    const navH = (document.querySelector('nav') || {}).offsetHeight || 60;
    const over = nb.getBoundingClientRect().bottom - (window.innerHeight - navH - 12);
    if (over > 0) window.scrollBy({ top: over, behavior: 'smooth' });
    CJ.autoSpeak(q.answer);
  }

  function renderEnd() {
    $('counter').textContent = t('q.finished'); $('progFill').style.width = '100%';
    const pct = score / qs.length;
    const msg = t(pct === 1 ? 'q.msg100' : pct >= 0.7 ? 'q.msg70' : pct >= 0.4 ? 'q.msg40' : 'q.msg0');
    const n = mistakeIds().length;
    $('qBox').innerHTML = '<div class="score-big">' + score + ' / ' + qs.length + '</div><p style="text-align:center; margin:0.4rem 0 1rem;">' + esc(msg) + '</p>' +
      '<button class="btn" data-act="again">' + esc(t('q.again')) + '</button>' +
      (n ? '<button class="btn" data-act="mode" data-m="mistakes" style="margin-top:0.6rem; background:#be123c;">' + esc(t('q.reviewMistakes', { n })) + '</button>' : '') +
      '<a class="btn btn-secondary" href="cards.html" style="margin-top:0.6rem;">' + esc(t('q.backCards')) + '</a>';
  }

  $('modeRow').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; start(); });
  $('qBox').addEventListener('click', e => {
    const opt = e.target.closest('.option-btn');
    if (opt) { answer(Number(opt.dataset.k)); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'next') { qi++; answered = -1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a.dataset.act === 'again') start();
    else if (a.dataset.act === 'mode') { mode = a.dataset.m; start(); }
  });
  document.addEventListener('cj:lang', () => { if (lastOk && answered >= 0) rightMsg = pick(t('q.right').split('|')); render(); });

  start();
})();
</script>
</body>
</html>
