<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kanji – マルちゃんのペースでいいよ</title>
<meta name="theme-color" content="#e0517a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><a class="logo" href="index.html">🌸 マルちゃんのペースでいいよ</a><span class="streak-badge" id="streakBadge">🔥 0 days</span></header>

<main class="container">
  <details class="card tips" id="tipsBox">
    <summary data-i18n="kj.tipsTitle"></summary>
    <ol class="tips-list" id="tipsList"></ol>
  </details>

  <select class="pick" id="catSel" aria-label="Kanji list"></select>

  <div class="card" id="detail" style="scroll-margin-top:72px;"></div>

  <div class="counter"><span class="muted" id="countText"></span><button class="tiny-btn" id="furiBtn"></button></div>
  <div class="kj-grid" id="grid"></div>

  <a class="btn" href="quiz.html?mode=kanji" style="margin-top:1rem;" data-i18n="kj.toQuiz"></a>
  <a class="btn btn-secondary" href="quiz.html?mode=onkun" style="margin-top:0.5rem;" data-i18n="kj.toOnkun"></a>
</main>


<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="grammar-data.js"></script>
<script src="read-data.js"></script>
<script src="examples-data.js"></script>
<script src="kanji-data.js"></script>
<script src="words-data.js"></script>
<script src="common.js"></script>
<script src="bank.js"></script>
<script>
(function () {
  const K = window.CJ_KANJI, W = window.CJ_WORDS.WORDS, B = window.CJ_BANK, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  const params = new URLSearchParams(location.search);
  // 「アプリの文に出てくる漢字」：文の倉庫から自動で集める
  const appSet = new Set(); B.items.forEach(it => B.kanjiIn(it).forEach(k => appSet.add(k)));
  const CATS = {
    g1: () => K.KANJI.filter(x => x.g === 1),
    g2: () => K.KANJI.filter(x => x.g === 2),
    life: () => Array.from(K.LIFE).map(k => B.kanjiBy[k]).filter(Boolean),
    app: () => K.KANJI.filter(x => appSet.has(x.k)),
    all: () => K.KANJI,
    todo: () => { const l = new Set(CJ.getData().kanji); return K.KANJI.filter(x => !l.has(x.k)); }
  };
  let cat = 'g1', list = [], i = 0, hideFuri = false, showAllSent = false;
  const wantK = params.get('k');
  if (wantK && B.kanjiBy[wantK]) { const x = B.kanjiBy[wantK]; cat = x.g === 1 ? 'g1' : x.g === 2 ? 'g2' : appSet.has(x.k) ? 'app' : 'all'; }

  function setList(keepK) {
    list = CATS[cat]();
    i = 0;
    if (keepK) { const n = list.findIndex(x => x.k === keepK); if (n >= 0) i = n; }
    showAllSent = false;
  }
  // コツ は 最初だけ ひらいて おく（いちど とじたら、つぎ から は とじた まま）
  try { if (!localStorage.getItem('cj_kjTipsSeen')) $('tipsBox').open = true; } catch (e) {}
  $('tipsBox').addEventListener('toggle', () => { if (!$('tipsBox').open) try { localStorage.setItem('cj_kjTipsSeen', '1'); } catch (e) {} });
  function renderTips() { $('tipsList').innerHTML = K.KANJI_TIPS.map(x => '<li>' + (CJ.lang() === 'ja' ? CJ.jaText(x.ja) : x.en) + '</li>').join(''); }
  function renderCats() {
    $('catSel').innerHTML = Object.keys(CATS).map(c => '<option value="' + c + '"' + (c === cat ? ' selected' : '') + '>' + esc(t('kj.cat.' + c, { n: CATS[c]().length })) + '</option>').join('');
  }
  // 読み方：「ひと(つ)」の( )は送りがななので少し薄く出す
  function readHtml(s) {
    if (!s) return '<span class="muted">' + t('kj.none') + '</span>';
    return s.split('・').map(r => esc(r).replace(/\(([^)]*)\)/g, '<span class="muted">($1)</span>')).join('<span class="muted"> ・ </span>');
  }
  function sayOf(x) { return (x.kun || x.on).split('・')[0].replace(/[()]/g, ''); }

  function renderDetail() {
    const x = list[i], box = $('detail');
    if (!x) { box.innerHTML = '<p>' + esc(t('kj.noneHere')) + '</p>'; return; }
    const learned = CJ.isKanjiLearned(x.k), enOnly = t('kj.enOnly');
    const vocab = W.filter(w => w.id.includes(x.k));                 // 「たんご」の中で、この漢字を使う言葉
    const own = x.words.filter(w => !vocab.some(v => v.id === CJ.plain(w[0])));
    const sents = B.withKanji(x.k);                                    // アプリの文で、この漢字を使うもの
    const shown = showAllSent ? sents : sents.slice(0, 5);
    box.innerHTML =
      '<div class="counter"><span class="muted">' + (i + 1) + ' / ' + list.length + '</span><span>' + CJ.askLink('漢字 ' + x.k) + '<span class="learned-mark">' + (learned ? ' ✓' : '') + '</span></span></div>' +
      '<div class="kj-big ja">' + esc(x.k) + '</div>' +
      '<div class="kj-meaning">' + esc(x.m) + ' ' + CJ.sayBtns(sayOf(x)) + '</div>' +
      '<div class="kj-read"><span class="lbl">' + esc(t('kj.kun')) + '</span><span class="v ja">' + readHtml(x.kun) + '</span>' +
      '<span class="lbl">' + esc(t('kj.on')) + '</span><span class="v ja">' + readHtml(x.on) + '</span></div>' +
      (/\(/.test(x.kun) ? '<div class="muted" style="font-size:0.75rem;">' + esc(t('kj.okuri')) + '</div>' : '') +
      '<div class="kj-box img">' + esc(t('kj.image')) + '：' + esc(x.img) + '</div>' +
      (x.tip ? '<div class="kj-box tipb">' + esc(t('kj.tip')) + '：' + esc(x.tip) + '</div>' : '') +
      (enOnly ? '<div class="muted" style="font-size:0.75rem; margin-top:0.3rem;">' + esc(enOnly) + '</div>' : '') +
      // 言葉（単語・熟語）
      '<div class="words" style="margin-top:0.8rem;"><div style="font-weight:700; margin-bottom:0.3rem;">' + esc(t('kj.related')) + '</div>' +
      vocab.map(w => '<div class="ex-row"><div><div class="k ja">' + CJ.ruby(w.kj) + ' ' + CJ.rtHtml(w.kj) + '</div><div class="romaji">' + esc(w.r) + '</div><div class="e">' + esc(w.en) + '</div>' +
        '<a class="link-chip wd" href="words.html?w=' + encodeURIComponent(w.id) + '">📝 ' + esc(w.id) + ' →</a></div>' + CJ.sayBtns(w.kana) + '</div>').join('') +
      own.map(w => '<div class="ex-row"><div><div class="k ja">' + CJ.ruby(w[0]) + ' ' + CJ.rtHtml(w[0]) + '</div><div class="romaji">' + esc(w[1]) + '</div><div class="e">' + esc(w[2]) + '</div></div>' + CJ.sayBtns(CJ.reading(w[0])) + '</div>').join('') +
      '</div>' +
      // アプリの例文（タップで ふつう ⇔ ていねい）
      '<div style="font-weight:700; margin:0.8rem 0 0.2rem;">' + esc(t('kj.sentences', { n: sents.length })) + '</div>' +
      '<div class="tap-hint">' + esc(t('tap.hint')) + '</div>' +
      '<div id="sentList">' + shown.map(it => CJ.flipHtml(it.key, it, !!flipped[it.key])).join('') + '</div>' +
      (sents.length > shown.length ? '<button class="tiny-btn" data-act="more">＋ ' + (sents.length - shown.length) + '</button>' : '') +
      '<div style="font-weight:700; margin:0.8rem 0 0;">' + esc(t('kj.native')) + '</div>' + CJ.extLinks([x.words[0] ? CJ.reading(x.words[0][0]) : x.k, '', x.words[0] ? x.words[0][0] : x.k]) +
      '<div class="btn-row"><button class="btn btn-secondary" data-act="prev" aria-label="prev">←</button>' +
      '<button class="btn ' + (learned ? 'btn-secondary' : 'btn-ok') + '" data-act="learn" style="flex:3;">' + esc(t(learned ? 'kj.unknow' : 'kj.know')) + '</button>' +
      '<button class="btn btn-secondary" data-act="next" aria-label="next">→</button></div>';
  }
  const flipped = {};

  function renderGrid() {
    const learned = new Set(CJ.getData().kanji);
    $('grid').innerHTML = list.map((x, n) => '<button class="kj-tile' + (learned.has(x.k) ? ' learned' : '') + (n === i ? ' current' : '') + '" data-n="' + n + '" aria-label="' + esc(x.k + ' ' + x.m) + '">' + esc(x.k) + '</button>').join('');
    $('countText').textContent = t('kj.count', { n: list.filter(x => learned.has(x.k)).length, m: list.length });
    $('furiBtn').textContent = t(hideFuri ? 'kj.showFuri' : 'kj.hideFuri');
  }
  function render() { renderCats(); renderDetail(); renderGrid(); }

  $('catSel').addEventListener('change', e => { cat = e.target.value; setList(); render(); });
  $('grid').addEventListener('click', e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    i = Number(b.dataset.n); showAllSent = false; renderDetail(); renderGrid();
    $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    CJ.markStudied();
  });
  $('detail').addEventListener('click', e => {
    if (e.target.closest('[data-say], a')) return;
    const f = e.target.closest('[data-flip]');
    if (f) { flipped[f.dataset.flip] = !flipped[f.dataset.flip]; renderDetail(); return; }
    const b = e.target.closest('[data-act]'); if (!b || !list.length) return;
    if (b.dataset.act === 'more') { showAllSent = true; renderDetail(); return; }
    if (b.dataset.act === 'prev') i = (i - 1 + list.length) % list.length;
    else if (b.dataset.act === 'next') i = (i + 1) % list.length;
    else if (b.dataset.act === 'learn') {
      const k = list[i].k, on = CJ.toggleKanji(k);
      CJ.toast(t(on ? 'toast.learned' : 'toast.unlearned'));
      if (cat === 'todo') { setList(); i = Math.min(i, list.length - 1); }
      else if (on) i = (i + 1) % list.length;
    }
    showAllSent = false; renderCats(); renderDetail(); renderGrid();
  });
  // よみかた（ふりがな・ローマ字）を隠して、自分で読めるか試す
  $('furiBtn').addEventListener('click', () => { hideFuri = !hideFuri; document.body.classList.toggle('hide-furi', hideFuri); renderGrid(); });
  document.addEventListener('cj:lang', () => { renderTips(); render(); });
  document.addEventListener('cj:kanji', renderDetail);

  setList(wantK); renderTips(); render();
})();
</script>
</body>
</html>
