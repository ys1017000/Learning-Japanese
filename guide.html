<script>
(function () {
  const B = window.CJ_BANK, $ = id => document.getElementById(id), esc = CJ.esc, t = CJ.t;
  const ja = () => CJ.lang() === 'ja';
  const L = (en, jp) => ja() ? CJ.jaText(jp) : en;   // このページの説明（英語／ひらがな）
  const flipped = {};

  // ていねい → ふつう で かわるところ
  const CHANGES = [
    ['です', 'だ ／ (なし)', 'げんき です → げんき (だよ)'],
    ['〜ます', '〜る・〜う (じしょ の かたち)', 'いきます → いく'],
    ['〜ました', '〜た', 'たべました → たべた'],
    ['〜ません', '〜ない', 'のみません → のまない'],
    ['〜ですか？', '〜？ ↗（か なし）', 'げんき です か？ → げんき？'],
    ['〜て ください', '〜て (ね)', 'まって ください → まって'],
    ['〜て います', '〜てる', 'みて います → みてる'],
    ['すみません', 'ごめん (ね)', ''],
    ['はい ／ いいえ', 'うん ／ ううん', ''],
    ['そう です ね', 'そう だね', ''],
    ['を・が を つかう', 'よく はぶく', 'なに を たべます か？ → なに たべる？']
  ];
  // 例：タップで切り替えて くらべる
  const EXAMPLE_KEYS = ['card:doko', 'card:taberu', 'card:okurete', 'gr:past:0', 'rd:cafe:1', 'gr:omou:3'];

  function render() {
    const sec = (title, body) => '<div class="card gd-sec"><h3>' + title + '</h3>' + body + '</div>';
    let html = '';
    html += sec(L('1. The big idea', '1. いちばん だいじ な こと'),
      '<p>' + L('<span class="reg polite">POLITE</span> (です・ます) is not "nicer" and <span class="reg casual">CASUAL</span> is not "rude". It is about <b>distance</b>: polite = a kind, respectful distance. Casual = close and relaxed.',
        '<span class="reg polite">ていねい</span>（です・ます） が 「やさしい」 で、<span class="reg casual">ふつう</span> が 「しつれい」 では ありません。だいじ なのは <b>きょり</b>：ていねい ＝ やさしい きょり、ふつう ＝ ちかくて リラックス。') + '</p>');
    html += sec(L('2. Who gets which?', '2. だれ に どっち？'),
      '<table class="gd-table"><tr><th>' + t('reg.polite') + '</th><th>' + t('reg.casual') + '</th></tr>' +
      '<tr><td class="p">' + L('your boss, coworkers you don\'t know well, teachers', 'じょうし・まだ したしく ない どうりょう・せんせい') + '</td><td class="c">' + L('Yoh-chan, close friends', 'ようちゃん・なかよし の ともだち') + '</td></tr>' +
      '<tr><td class="p">' + L('shop and restaurant staff, strangers', 'おみせ の ひと・しらない ひと') + '</td><td class="c">' + L('kids, people younger than you who are close', 'こども・なかよし の としした') + '</td></tr>' +
      '<tr><td class="p">' + L('people you just met, older people', 'はじめて あった ひと・としうえ の ひと') + '</td><td class="c">' + L('friends of friends — after they talk casually to you', 'ともだち の ともだち（あいて が ふつう に なったら）') + '</td></tr></table>');
    html += sec(L('3. What changes', '3. なに が かわる？'),
      '<table class="gd-table ja"><tr><th>' + t('reg.polite') + '</th><th>' + t('reg.casual') + '</th><th></th></tr>' +
      CHANGES.map(r => '<tr><td class="p">' + esc(r[0]) + '</td><td class="c">' + esc(r[1]) + '</td><td class="muted" style="font-size:0.8rem;">' + esc(r[2]) + '</td></tr>').join('') + '</table>');
    html += sec(L('4. Tips', '4. コツ'), '<ul>' + [
      L('<b>Not sure? Use polite.</b> Nobody gets upset about polite Japanese.', '<b>まよったら ていねい。</b> ていねい で おこる ひと は いません。'),
      L('<b>Follow the other person.</b> When someone starts talking casually to you, you can switch too.', '<b>あいて に あわせる。</b> あいて が ふつう で はなしはじめたら、あなた も ふつう で OK。'),
      L('<b>Polite can be warm.</b> Add ね or よ: きれい です ね！ sounds friendly, not cold.', '<b>ていねい でも あたたかく できる。</b> 「ね」「よ」 を つける：きれい です ね！'),
      L('<b>A plain だ at the end can sound strong.</b> In casual talk, people usually say だよ or だね instead of only だ.', '<b>さいご が 「だ」 だけ だと つよく きこえる ことも。</b> ふつう の かいわ では 「だよ」「だね」 が よく つかわれます。'),
      L('<b>At school (work)</b>, talk politely with coworkers — even younger ones — until you become close.', '<b>しょくば では</b>、したしく なる まで どうりょう にも ていねい に（としした でも）。'),
      L('<b>Shops use extra-polite Japanese (keigo)</b> to you: いらっしゃいませ, しょうしょう おまち ください. You don\'t need to talk like that — normal polite is perfect.', '<b>おみせ の ひと は もっと ていねい な けいご で はなします</b>（いらっしゃいませ・しょうしょう おまち ください）。あなた は ふつう の ていねい で じゅうぶん。'),
      L('<b>Messages:</b> DMs with Yoh-chan → casual + emoji. Email to school → polite.', '<b>メッセージ：</b> ようちゃん との DM → ふつう ＋ えもじ。がっこう への メール → ていねい。')
    ].map(x => '<li>' + x + '</li>').join('') + '</ul>');
    // 場面 で きまる（だれ に・どこ で）
    const SC = [
      [L('Introducing yourself', 'じこしょうかい'), 'p', 'はじめまして、マル です。'],
      [L('Ordering, paying, asking staff', 'ちゅうもん・おかいけい・てんいん に きく'), 'p', 'おかいけい おねがい します。'],
      [L('Inviting a coworker to lunch', 'どうりょう を ランチ に さそう'), 'p', 'いっしょ に ランチ に いきません か？'],
      [L('Inviting Yoh-chan or friends (hiking, movie night)', 'ようちゃん や ともだち を さそう（ハイキング・えいが）'), 'c', 'しゅうまつ、 ハイキング いかない？'],
      [L('DMs with Yoh-chan', 'ようちゃん との DM'), 'c', 'いま おわった よ！'],
      [L('Friends of friends', 'ともだち の ともだち'), 'pc', L('start polite → casual when they are', 'さいしょ ていねい → あいて が ふつう に なったら ふつう')]
    ];
    html += sec(L('5. It depends on the scene', '5. ばめん で きまる'),
      '<p>' + L('It is less about grammar and more about <b>who</b> and <b>where</b>. Some scenes are almost always one way:', 'ぶんぽう より、<b>だれ に</b>・<b>どこ で</b> が だいじ。ほとんど いつも どちらか に きまって いる ばめん も あります：') + '</p>' +
      '<table class="gd-table"><tr><th>' + L('Scene', 'ばめん') + '</th><th></th></tr>' +
      SC.map(r => '<tr><td>' + esc(r[0]) + '<div class="muted ja" style="font-size:0.8rem;">' + esc(r[2]) + '</div></td><td>' +
        (r[1] === 'pc' ? '<span class="reg polite">' + t('reg.polite') + '</span> → <span class="reg casual">' + t('reg.casual') + '</span>' : '<span class="reg ' + (r[1] === 'p' ? 'polite' : 'casual') + '">' + t(r[1] === 'p' ? 'reg.polite' : 'reg.casual') + '</span>') +
        '</td></tr>').join('') + '</table>' +
      '<p style="margin-top:0.5rem;">' + L('〜ませんか？ (polite invitation) is from textbooks and is fine at work. But for personal plans with close people, Japanese people use 〜ない？ or 〜しよう.', '「〜ません か？」（ていねい な さそいかた） は しょくば なら OK。でも したしい ひと との プライベート な よてい は 「〜ない？」「〜しよう」 を つかいます。') + '</p>');
    html += sec(L('6. Like du and Sie in German?', '6. ドイツご の du と Sie に にてる？'),
      '<p>' + L('Yes, a little! Polite ≈ <b>Sie</b>, casual ≈ <b>du</b>. But there are some differences:', 'すこし にてる！ ていねい ≈ <b>Sie</b>、ふつう ≈ <b>du</b>。でも ちがう ところ も あります：') + '</p><ul>' + [
        L('<b>No "let\'s say du" moment.</b> In Japanese, nobody says "let\'s talk casually now". People slowly switch as they get closer. Easy rule: <b>when they talk casually to you, you can too.</b>', '<b>「du で はなそう」 と いう しゅんかん が ない。</b> にほんご では 「ふつう で はなそう」 と あまり いいません。したしく なる と だんだん かわります。かんたん な ルール：<b>あいて が ふつう に なったら、あなた も ふつう で OK。</b>'),
        L('<b>Mixing is normal.</b> Even in polite talk, people often say short casual reactions: えー、すごい！ そうなんだ！', '<b>まぜる の は ふつう。</b> ていねい な かいわ でも、みじかい リアクション は ふつう に なる こと が おおい：えー、すごい！ そうなんだ！'),
        L('<b>Same age doesn\'t mean casual.</b> At work and in shops, people stay polite even with people their own age.', '<b>おなじ とし でも ふつう とは かぎらない。</b> しょくば や おみせ では、おなじ とし でも ていねい。'),
        L('<b>With people close to you, casual.</b> With Yoh-chan and good friends, polite Japanese can sound a bit distant — or like a joke. So with Yoh-chan: casual is just right! 😊', '<b>なかよし の ひと には ふつう。</b> ようちゃん や なかよし の ともだち に ていねい だと、すこし きょり が ある ように きこえる（か、じょうだん）。だから ようちゃん には ふつう が ちょうど いい よ！ 😊')
      ].map(x => '<li>' + x + '</li>').join('') + '</ul>');
    html += '<div class="card gd-sec"><h3>' + esc(t('gd.examples')) + '</h3><div class="tap-hint">' + esc(t('tap.hint')) + '</div>' +
      EXAMPLE_KEYS.map(k => B.byKey[k]).filter(Boolean).map(it => CJ.flipHtml(it.key, it, !!flipped[it.key])).join('') + '</div>';
    $('guide').innerHTML = html;
  }
  $('guide').addEventListener('click', e => {
    if (e.target.closest('[data-say], a')) return;
    const c = e.target.closest('[data-flip]'); if (!c) return;
    flipped[c.dataset.flip] = !flipped[c.dataset.flip]; render();
  });
  document.addEventListener('cj:lang', render);
  document.addEventListener('cj:kanji', render);
  render();
  CJ.markStudied();
})();
</script>
</body>
</html>
